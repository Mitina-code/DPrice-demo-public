/* ===================== РЕГИОНЫ И ЯЗЫКИ (поверх исходной модели calculator_v4) ===================== */
// Курс для пересчёта стоимости DPrice из рублей. Источник и дата показываются на странице.
const FX = { date: '2026-10-09', src: 'open.er-api.com', perUSD: { USD: 1, RUB: 85.432836, THB: 33.66797, AED: 3.6725 } };
const DPRICE_COST_RUB_MLN = 5; // исходный калькулятор: 5 млн ₽ в год

// lim: [min, max, step, значение по умолчанию]. cover — доля платежей покупателей, гасящих кредит до сдачи.
const REGIONS = {
  global: { cur: 'USD', au: 'm2', cover: 0.5, priceMin: 1000,
    lim: { lots: [100, 1000, 1, 300], area: [30, 150, 1, 70], price: [1000, 12000, 50, 4000], loan: [5, 400, 1, 40],
           rate: [3, 15, 0.25, 8], planned: [12, 96, 1, 36], pace: [2, 25, 0.1, 9] } },
  uae:    { cur: 'AED', au: 'sqft', cover: 0.6, priceMin: 800,
    lim: { lots: [100, 1000, 1, 300], area: [400, 1800, 10, 750], price: [800, 6000, 25, 2900], loan: [20, 1500, 5, 200],
           rate: [4, 12, 0.25, 7.5], planned: [12, 96, 1, 36], pace: [2, 25, 0.1, 9] } },
  th:     { cur: 'THB', au: 'm2', cover: 0.3, priceMin: 50000,
    lim: { lots: [100, 1500, 1, 400], area: [22, 90, 1, 35], price: [50000, 350000, 1000, 140000], loan: [100, 6000, 10, 800],
           rate: [3, 10, 0.25, 6], planned: [12, 96, 1, 36], pace: [3, 25, 0.1, 12] } },
  ru:     { cur: 'RUB', au: 'm2', cover: 1, priceMin: 150000,
    lim: { lots: [100, 500, 1, 361], area: [24, 42, 1, 34], price: [150000, 750000, 5000, 250000], loan: [400, 8000, 50, 2500],
           rate: [10, 24, 0.5, 17], planned: [12, 120, 1, 42], pace: [4, 22, 0.1, 11] } }
};
const REGION_ORDER = ['global', 'uae', 'th', 'ru'];
const REGION_LANG = { global: 'en', uae: 'en', th: 'th', ru: 'ru' };
const LANGS = ['en', 'ru', 'ar', 'th'];
const LOCALE = { en: 'en-GB', ru: 'ru-RU', ar: 'ar-AE-u-nu-latn', th: 'th-TH' };
const AU = { en: { m2: 'm²', sqft: 'sq ft' }, ru: { m2: 'м²', sqft: 'кв. фут' }, ar: { m2: 'م²', sqft: 'قدم²' }, th: { m2: 'ตร.ม.', sqft: 'ตร.ฟุต' } };

let REGION = 'global', LANG = 'en';
const R = () => REGIONS[REGION];
const costMln = cur => cur === 'RUB' ? DPRICE_COST_RUB_MLN : DPRICE_COST_RUB_MLN / FX.perUSD.RUB * FX.perUSD[cur];

function t(key, vars = {}) {
  const k = key;
  let s = (CALC_I18N[LANG] && CALC_I18N[LANG][k]) ?? CALC_I18N.en[k] ?? k;
  const all = { cur: curSym(), au: AU[LANG][R().au], ...vars };
  for (const [a, b] of Object.entries(all)) s = s.split('{' + a + '}').join(b);
  return s;
}
function curSym() {
  try {
    return new Intl.NumberFormat(LOCALE[LANG], { style: 'currency', currency: R().cur, currencyDisplay: 'narrowSymbol' })
      .formatToParts(0).find(p => p.type === 'currency').value;
  } catch (e) { return R().cur; }
}
const nf = o => new Intl.NumberFormat(LOCALE[LANG], o);

/* ---- форматирование: переопределяет функции исходника (последнее объявление побеждает) ---- */
function fmtMln(v) {
  if (!Number.isFinite(v)) return '—';
  return nf({ style: 'currency', currency: R().cur, notation: 'compact', maximumFractionDigits: Math.abs(v) < 1 || Math.abs(v) >= 1000 ? 2 : 1 }).format(v * 1e6);
}
function fmtPriceM2(v) {
  if (!Number.isFinite(v)) return '—';
  return nf({ style: 'currency', currency: R().cur, maximumFractionDigits: 0 }).format(Math.round(v)) + '/' + AU[LANG][R().au];
}
function fmtMonth(v) { return Number.isFinite(v) ? t('months', { n: nf({ minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(v) }) : '—'; }
function fmtMonthInt(v) { return Number.isFinite(v) ? t('months', { n: Math.round(v) }) : '—'; }
function rawNumber(v, digits = 3) { return Number.isFinite(v) ? nf({ maximumFractionDigits: digits }).format(v) : '—'; }
function rawSigned(v, digits = 3, suffix = '') {
  if (!Number.isFinite(v)) return '—';
  return `${v >= 0 ? '+' : '−'}${nf({ maximumFractionDigits: digits }).format(Math.abs(v))}${suffix ? ' ' + suffix : ''}`;
}
const signedMoney = v => Number.isFinite(v) ? (v >= 0 ? '+' : '−') + fmtMln(Math.abs(v)) : '—';
function fmtMonthsRange(min, max) {
  if (!Number.isFinite(min) || !Number.isFinite(max)) return '—';
  if (Math.round(min) === Math.round(max)) return t('months', { n: Math.round(min) });
  return t('months', { n: `${Math.round(min)}–${Math.round(max)}` });
}
function fmtPace(v) { return Number.isFinite(v) ? `${nf({ maximumFractionDigits: 1 }).format(v)} ${t('u_pace')}` : '—'; }
function plannedCriterionLabel() {
  const x = PLANNED_LIMIT_CONFIG.MIN_ROI_X;
  return Number.isFinite(x) && x > 0 ? t('crit_target', { x: rawNumber(x, 0) }) : t('crit_pos');
}
function paceCriterionLabel() {
  return PACE_LIMIT_CONFIG.REQUIRE_TARGET_ROI && PLANNED_LIMIT_CONFIG.MIN_ROI_X > 0 ? t('crit_target', { x: rawNumber(PLANNED_LIMIT_CONFIG.MIN_ROI_X, 0) }) : t('crit_pos');
}
function updateSliderGradient(el) {
  if (!el) return;
  const min = parseFloat(el.min), max = parseFloat(el.max), val = parseFloat(el.value);
  const pct = Math.abs(max - min) < MODEL_CONSTANTS.EPS ? 100 : ((val - min) / (max - min)) * 100;
  el.style.setProperty('--pct', pct + '%');
  const dir = document.documentElement.dir === 'rtl' ? 'to left' : 'to right';
  el.style.background = `linear-gradient(${dir}, #22b866 0%, #22b866 ${pct}%, #E3E7E1 ${pct}%)`;
}

/* ---- подсказки под ползунками ---- */
const WARN = '#C77C02', ALERT = '#C2412F';
function updateLoanLimitNote(info) {
  const node = document.getElementById('loan-limit-note');
  if (!node || !info) return;
  const L = SLIDER_LIMITS.loan;
  const sliderMin = Number.isFinite(info.sliderMin) ? info.sliderMin : L.min;
  const sliderMax = Number.isFinite(info.sliderMax) ? info.sliderMax : L.max;
  const span = Math.max(sliderMax - sliderMin, MODEL_CONSTANTS.EPS);
  let tone = 'var(--gray-light)', text = t('n_loan', { a: fmtMln(sliderMin), b: fmtMln(sliderMax) });
  if (!info.hasPositiveRoiLoan) { tone = WARN; text = t('n_loan_tbd'); }
  else if (info.isBelowUiMin) { tone = WARN; text = t('n_loan_low'); }
  else if (sliderMax <= sliderMin + MODEL_CONSTANTS.EPS) { tone = WARN; text = t('n_loan_one', { a: fmtMln(sliderMin) }); }
  else if (info.cappedByHardMax) { /* обычный текст */ }
  else if (state.loan - sliderMin <= LOAN_LIMIT_CONFIG.NOTE_WARNING_RATIO * span + MODEL_CONSTANTS.EPS) { tone = WARN; text = t('n_loan_min', { a: fmtMln(sliderMin) }); }
  else if (sliderMax - state.loan <= LOAN_LIMIT_CONFIG.NOTE_WARNING_RATIO * span + MODEL_CONSTANTS.EPS) { tone = WARN; text = t('n_loan_max', { a: fmtMln(sliderMax) }); }
  node.style.color = tone; node.textContent = text.replace(/..$/, '.');
}
function updatePlannedLimitNote(info) {
  const node = document.getElementById('planned-limit-note');
  if (!node || !info) return;
  let tone = 'var(--gray-light)', text = t('n_plan', { r: fmtMonthsRange(info.min, info.max) });
  if (!info.hasFeasibleSelloutPeriod) { tone = WARN; text = t('n_plan_tbd'); }
  else {
    const ratio = info.max > MODEL_CONSTANTS.EPS ? state.planned / info.max : Infinity;
    if (ratio >= 1) { tone = WARN; text = t('n_plan_at', { r: fmtMonthsRange(info.min, info.max) }); }
    else if (ratio >= PLANNED_LIMIT_CONFIG.NOTE_WARNING_RATIO) { tone = WARN; text = t('n_plan_near', { r: fmtMonthsRange(info.min, info.max) }); }
  }
  node.style.color = tone; node.textContent = text.replace(/..$/, '.');
}
function updatePaceLimitNote(info) {
  const node = document.getElementById('pace-limit-note');
  if (!node || !info) return;
  let tone = 'var(--gray-light)', text = t('n_pace', { a: fmtPace(info.min), b: fmtPace(info.max) });
  if (!info.hasPositiveRoiPace) { tone = ALERT; text = t('n_pace_none'); }
  else if (PACE_LIMIT_CONFIG.REQUIRE_TARGET_ROI && !info.hasTargetRoiPace) { tone = WARN; text = t('n_pace_target', { a: fmtPace(info.min), b: fmtPace(info.max) }); }
  else {
    const span = Math.max(info.max - info.min, MODEL_CONSTANTS.EPS);
    if (state.pace - info.min <= PACE_LIMIT_CONFIG.NOTE_WARNING_RATIO * span + MODEL_CONSTANTS.EPS) { tone = WARN; text = t('n_pace_near', { c: paceCriterionLabel(), a: fmtPace(info.min) }); }
  }
  node.style.color = tone; node.textContent = text.replace(/..$/, '.');
}

/* ---- таблица сравнения и график ---- */
function renderComparisonTable(base, opt, optCandidate, params) {
  const grossGain = opt.profitGross - base.profitGross, netGain = opt.profit - base.profit;
  const roi = opt.dpriceCost > MODEL_CONSTANTS.EPS ? netGain / opt.dpriceCost : NaN;
  const xtBaseOk = Math.abs(base.finalSales - params.lots) <= 0.5, xtOptOk = Math.abs(opt.finalSales - params.lots) <= 0.5;
  const rows = [
    [t('r_sales'), rawNumber(base.finalSales, 2), rawNumber(opt.finalSales, 2), rawSigned(opt.finalSales - base.finalSales, 2), opt.finalSales >= base.finalSales, false],
    [t('r_price'), fmtPriceM2(base.avgPriceM2), fmtPriceM2(opt.avgPriceM2), (opt.avgPriceM2 - base.avgPriceM2 >= 0 ? '+' : '−') + fmtPriceM2(Math.abs(opt.avgPriceM2 - base.avgPriceM2)), opt.avgPriceM2 - base.avgPriceM2 >= 0, false],
    [t('r_rev'), fmtMln(base.totalRevenue), fmtMln(opt.totalRevenue), signedMoney(opt.totalRevenue - base.totalRevenue), opt.totalRevenue - base.totalRevenue >= 0, false],
    [t('r_int'), fmtMln(base.totalInterest), fmtMln(opt.totalInterest), signedMoney(opt.totalInterest - base.totalInterest), opt.totalInterest - base.totalInterest <= 0, false],
    [t('r_gross'), fmtMln(base.profitGross), fmtMln(opt.profitGross), signedMoney(grossGain), grossGain >= -MODEL_CONSTANTS.GROSS_TOL, true],
    [t('r_cost'), fmtMln(0), fmtMln(opt.dpriceCost), signedMoney(-opt.dpriceCost), false, false],
    [t('r_net'), fmtMln(base.profit), fmtMln(opt.profit), signedMoney(netGain), netGain >= 0, true],
    [t('r_geff'), fmtMln(0), fmtMln(grossGain), signedMoney(grossGain), grossGain >= -MODEL_CONSTANTS.GROSS_TOL, true],
    [t('r_neff'), fmtMln(0), fmtMln(netGain), signedMoney(netGain), netGain >= 0, true],
    [t('r_roi'), '—', fmtX(roi), fmtX(roi), roi >= 0, true],
    [t('r_debt'), base.debtFreeMonth === null ? '—' : String(base.debtFreeMonth), opt.debtFreeMonth === null ? '—' : String(opt.debtFreeMonth), '—', (opt.debtFreeMonth ?? Infinity) <= (base.debtFreeMonth ?? Infinity), false],
    [t('r_plan'), xtBaseOk ? t('ok') : t('not_met'), xtOptOk ? t('ok') : '≈', t('plan_delta', { a: rawNumber(base.finalSales - params.lots, 2), b: rawNumber(opt.finalSales - params.lots, 2) }), xtOptOk, false]
  ];
  document.getElementById('comp-body').innerHTML = rows.map(([label, before, after, delta, positive, hl]) =>
    `<tr class="${hl ? 'highlight-row' : ''}"><td>${label}</td><td class="val-red">${before}</td><td class="val-green">${after}</td><td><span class="val-delta ${positive ? '' : 'negative'}">${delta}</span></td></tr>`).join('');
}
function buildChart(base, opt) {
  const maxMonths = Math.max(base.rows.length, opt.rows.length);
  const labels = Array.from({ length: maxMonths + 1 }, (_, i) => i === 0 ? t('start') : t('m', { i }));
  const series = (sim, key) => { const v = [0]; for (let i = 0; i < maxMonths; i++) { const row = sim.rows[Math.min(i, sim.rows.length - 1)]; v.push(row ? row[key] : v[v.length - 1]); } return v; };
  if (chart) chart.destroy();
  const canvas = document.getElementById('myChart');
  if (!canvas) return;
  const font = { family: getComputedStyle(document.body).fontFamily };
  chart = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: { labels, datasets: [
      { label: t('ds_with'), data: series(opt, 'profitNetToDate'), borderColor: '#22b866', backgroundColor: 'rgba(63,221,132,0.12)', borderWidth: 2.5, pointRadius: 0, tension: 0.25, fill: true },
      { label: t('ds_without'), data: series(base, 'profitGrossToDate'), borderColor: '#d9483b', backgroundColor: 'rgba(217,72,59,0.05)', borderWidth: 2, pointRadius: 0, tension: 0.25, fill: true, borderDash: [5, 3] }
    ] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', align: 'end', rtl: LANG === 'ar', labels: { font: { size: 12, ...font }, boxWidth: 20, padding: 12, usePointStyle: true, pointStyleWidth: 16 } },
        tooltip: { mode: 'index', intersect: false, rtl: LANG === 'ar', callbacks: {
          label: c => `${c.dataset.label}: ${fmtMln(c.parsed.y)}`,
          afterLabel: c => {
            if (c.dataIndex === 0) return [t('tt_start')];
            const sim = c.datasetIndex === 0 ? opt : base, row = sim.rows[Math.min(c.dataIndex - 1, sim.rows.length - 1)];
            return row ? [t('tt_cover', { v: fmtMln(row.endEscrow) }), t('tt_int', { v: fmtMln(row.cumulativeInterest) }), t('tt_dp', { v: fmtMln(row.dpriceCostAccrued) }), t('tt_unc', { v: fmtMln(row.uncoveredDebt) })] : [];
          } } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10, ...font }, maxTicksLimit: 8, color: '#8b93a0' } },
        y: { grid: { color: '#EEF1ED' }, ticks: { font: { size: 10, ...font }, color: '#8b93a0', callback: v => fmtMln(v) } }
      },
      interaction: { mode: 'index', intersect: false }, elements: { line: { borderCapStyle: 'round' } }
    }
  });
}

/* ---- пересчёт: тот же порядок, что в исходнике, тексты — на выбранном языке ---- */
function recalc() {
  try {
    applyAdaptiveSliderBounds();
    const params = buildCoreParams(state), demandParams = buildDemandParams(params);
    const feasibleSellout = params.lots >= params.plannedMonths * demandParams.qMin - MODEL_CONSTANTS.MODEL_TOL
      && params.lots <= params.plannedMonths * demandParams.qMax + MODEL_CONSTANTS.MODEL_TOL;
    const basePolicy = buildBasePolicy(params, demandParams);
    const base = simulatePolicy(basePolicy.prices, params, demandParams, { withDPrice: false });
    let optCandidate = optimizeControlPolicy(params, demandParams, { baseUnits: basePolicy.units });
    let opt = optCandidate.sim;
    if (feasibleSellout && opt.profitGross - base.profitGross < -MODEL_CONSTANTS.GROSS_TOL) {
      const fallbackSim = simulateUnitsPolicy(basePolicy.units, params, demandParams, { withDPrice: true });
      optCandidate = { ...optCandidate, source: 'forced_base_guard', sim: fallbackSim, units: basePolicy.units.slice(), prices: basePolicy.prices.slice() };
      opt = optCandidate.sim;
    }
    const netGain = opt.profit - base.profit;
    const revenueDelta = opt.totalRevenue - base.totalRevenue, interestSavings = base.totalInterest - opt.totalInterest;
    const roi = opt.dpriceCost > MODEL_CONSTANTS.EPS ? netGain / opt.dpriceCost : NaN;
    const monthlyGain = netGain / Math.max(params.plannedMonths, 1);
    const paybackMonths = monthlyGain > MODEL_CONSTANTS.EPS ? opt.dpriceCost / monthlyGain : Infinity;
    let debtText = '—';
    if (base.debtFreeMonth !== null && opt.debtFreeMonth !== null) {
      const d = base.debtFreeMonth - opt.debtFreeMonth;
      debtText = t('mo_signed', { s: d >= 0 ? '+' : '−', n: nf({ maximumFractionDigits: 1 }).format(Math.abs(d)) });
    }
    animVal('m-roi', fmtX(roi));
    animVal('m-payback', Number.isFinite(paybackMonths) ? (paybackMonths < 1 ? t('lt1') : fmtMonthInt(paybackMonths)) : t('never'));
    animVal('m-pf', fmtMln(interestSavings));
    animVal('m-extra', debtText);
    animVal('m-rev', fmtMln(revenueDelta));
    animVal('m-total', fmtMln(netGain));
    animVal('m-pf-loss', fmtMln(base.totalInterest));
    animVal('m-period-before', fmtMonth(base.salesDuration));
    animVal('m-period-after', fmtMonth(opt.salesDuration));
    const bar = document.getElementById('pb-bar');
    if (bar) bar.style.width = `${Math.min(100, Math.max(opt.salesDuration, 0) / Math.max(base.salesDuration, 1) * 100)}%`;
    renderComparisonTable(base, opt, optCandidate, params);
    renderDeferredVisuals(base, opt);
    window.__lastCalc = { base, opt, roi, netGain, revenueDelta, interestSavings, params };
  } catch (err) {
    console.error('recalc failed', err);
  }
}

/* ---- регион ---- */
function applyRegion(r) {
  REGION = r;
  const reg = R();
  COVER = reg.cover;
  MODEL_CONSTANTS.PRICE_POLICY_MIN = reg.priceMin;
  MODEL_CONSTANTS.DPRICE_ANNUAL_COST_MLN = costMln(reg.cur);
  for (const [k, [min, max, step, def]] of Object.entries(reg.lim)) { SLIDER_LIMITS[k] = { min, max, step }; state[k] = def; }
  Object.assign(LOAN_LIMIT_CONFIG, { HARD_MIN_MLN: reg.lim.loan[0], HARD_MAX_MLN: reg.lim.loan[1] });
  Object.assign(PLANNED_LIMIT_CONFIG, { HARD_MIN_MONTHS: reg.lim.planned[0], HARD_MAX_MONTHS: reg.lim.planned[1] });
  Object.assign(PACE_LIMIT_CONFIG, { HARD_MIN: reg.lim.pace[0], HARD_MAX: reg.lim.pace[1], STEP: reg.lim.pace[2] });
  const L = reg.lim;
  Object.assign(lastLoanLimitInfo, { rawMin: L.loan[0], rawMax: L.loan[1], rawProfitMax: L.loan[1], roiMin: L.loan[0], roiMax: L.loan[1], sliderMin: L.loan[0], sliderMax: L.loan[1], bestLoan: L.loan[0], source: 'initial' });
  Object.assign(lastPlannedLimitInfo, { min: L.planned[0], max: L.planned[1], selloutMin: L.planned[0], selloutMax: L.planned[1], source: 'initial' });
  Object.assign(lastPaceLimitInfo, { min: L.pace[0], max: L.pace[1], bestPace: L.pace[3], source: 'initial' });
  applySliderBounds();
}
function loadRealExample() { applyRegion(REGION); renderStatic(); recalc(); }

function renderStatic() {
  const html = document.documentElement;
  html.lang = LANG; html.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.title = t('doc_title');
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = REGION === 'ru' && el.dataset.tRuRegion ? el.dataset.tRuRegion : el.dataset.t;

  document.querySelectorAll('[data-v]').forEach(el => { el.textContent = el.dataset.v === 'au' ? AU[LANG][R().au] : `${curSym()}/${AU[LANG][R().au]}`; });
  document.getElementById('cta-note').textContent = t(REGION === 'ru' ? 'cta_note_ru' : 'cta_note');
  document.getElementById('regions').innerHTML = REGION_ORDER.map(r => `<button type="button" data-r="${r}" aria-pressed="${r === REGION}">${t('r_' + r)}</button>`).join('');
  document.getElementById('langs').innerHTML = LANGS.map(l => `<button type="button" data-l="${l}" lang="${l}" aria-pressed="${l === LANG}">${{ en: 'EN', ru: 'RU', ar: 'عربي', th: 'ไทย' }[l]}</button>`).join('');
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { const r = b.dataset.r; if (LANG !== 'ar') LANG = REGION_LANG[r]; applyRegion(r); renderStatic(); recalc(); });
  document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { LANG = b.dataset.l; renderStatic(); recalc(); });
  const reg = R(), cost = fmtMln(costMln(reg.cur));
  const stats = REGION === 'ru'
    ? [['st_ru1_v', 'st_ru1'], ['st_ru2_v', 'st_ru2'], ['st_ru3_v', 'st_ru3'], ['st_ru4_v', 'st_ru4']].map(([v, l]) => [t(v), t(l)])
    : [[reg.cur, t('st_cur')], [Math.round(reg.cover * 100) + '%', t('st_cover')], [cost, t('st_cost')], [nf({ maximumFractionDigits: 2 }).format(reg.lim.rate[3]) + '%', t('st_rate')]];
  document.getElementById('hero-stats').innerHTML = stats.map(([v, l]) => `<div class="hero-stat"><span class="hero-stat-num">${v}</span><div class="hero-stat-label">${l}</div></div>`).join('');
  const priceDef = fmtPriceM2(reg.lim.price[3]);
  document.getElementById('assumptions').innerHTML = [
    t('a_cur', { cur: reg.cur }),
    REGION === 'ru' ? t('a_cost_ru', { v: cost }) : t('a_cost', { v: cost, date: FX.date, src: FX.src }),
    t('a_cover', { c: Math.round(reg.cover * 100), why: t('why_cover_' + REGION) }),
    t('a_rate', { r: nf({ maximumFractionDigits: 2 }).format(reg.lim.rate[3]), why: t('why_rate_' + REGION) }),
    t('a_price', { p: priceDef, why: t('why_price_' + REGION) }),
  ].map(s => `<li>${s}</li>`).join('') + `<li class="note">${t('a_note')}</li>`;
  history.replaceState(null, '', `?region=${REGION}&lang=${LANG}`);
}

(function boot() {
  const q = new URLSearchParams(location.search);
  const r = REGION_ORDER.includes(q.get('region')) ? q.get('region') : 'global';
  LANG = LANGS.includes(q.get('lang')) ? q.get('lang') : REGION_LANG[r];
  applyRegion(r);
  renderStatic();
  applyAdaptiveSliderBounds();
  recalc();
})();
