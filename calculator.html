  if (!node || !info) return;

  const rawMin = Number.isFinite(info.rawMin) ? info.rawMin : SLIDER_LIMITS.loan.min;
  const rawMax = Number.isFinite(info.rawMax) ? info.rawMax : SLIDER_LIMITS.loan.max;
  const sliderMin = Number.isFinite(info.sliderMin) ? info.sliderMin : SLIDER_LIMITS.loan.min;
  const sliderMax = Number.isFinite(info.sliderMax) ? info.sliderMax : SLIDER_LIMITS.loan.max;
  const span = Math.max(sliderMax - sliderMin, MODEL_CONSTANTS.EPS);
  const distanceFromMin = state.loan - sliderMin;
  const distanceFromMax = sliderMax - state.loan;

  let tone = 'var(--gray-light)';
  let text = `Выполнимый диапазон кредита для введенных параметров ЖК: ${fmtMln(sliderMin)}–${fmtMln(sliderMax)}.`;

  if (!info.hasPositiveRoiLoan) {
    tone = '#F59E0B';
    text = `Выполнимый диапазон кредита для введенных параметров ЖК временно уточняется. Скорректируйте параметры и повторите расчет.`;
  } else if (info.isBelowUiMin) {
    tone = '#F59E0B';
    text = `Выполнимый диапазон кредита для введенных параметров ЖК находится у нижней границы слайдера.`;
  } else if (sliderMax <= sliderMin + MODEL_CONSTANTS.EPS) {
    tone = '#F59E0B';
    text = `Выполнимый диапазон кредита для введенных параметров ЖК сузился до одного значения: ${fmtMln(sliderMin)}.`;
  } else if (info.cappedByHardMax) {
    tone = 'var(--gray-light)';
    text = `Выполнимый диапазон кредита для введенных параметров ЖК: ${fmtMln(sliderMin)}–${fmtMln(sliderMax)}.`;
  } else if (distanceFromMin <= LOAN_LIMIT_CONFIG.NOTE_WARNING_RATIO * span + MODEL_CONSTANTS.EPS) {
    tone = '#F59E0B';
    text = `Текущее значение кредита близко к нижней границе рекомендуемого диапазона: ${fmtMln(sliderMin)}.`;
  } else if (distanceFromMax <= LOAN_LIMIT_CONFIG.NOTE_WARNING_RATIO * span + MODEL_CONSTANTS.EPS) {
    tone = '#F59E0B';
    text = `Текущее значение кредита близко к верхней границе рекомендуемого диапазона: ${fmtMln(sliderMax)}.`;
  }

  node.style.color = tone;
  node.textContent = text;
}

function fmtMonthsRange(min, max) {
  if (!Number.isFinite(min) || !Number.isFinite(max)) return '—';
  if (Math.round(min) === Math.round(max)) return `${Math.round(min)} мес.`;
  return `${Math.round(min)}–${Math.round(max)} мес.`;
}

function plannedCriterionLabel(info = lastPlannedLimitInfo) {
  const target = PLANNED_LIMIT_CONFIG.MIN_ROI_X;
  if (Number.isFinite(target) && target > 0) return `целевому ROI ≥ ${rawNumber(target, 0)}x`;
  return 'положительному ROI';
}

function updatePlannedLimitNote(info) {
  const node = document.getElementById('planned-limit-note');
  if (!node || !info) return;

  let tone = 'var(--gray-light)';
  let text = `Выполнимый плановый период для введенных параметров ЖК: ${fmtMonthsRange(info.min, info.max)}.`;

  if (!info.hasFeasibleSelloutPeriod) {
    tone = '#F59E0B';
    text = `Выполнимый плановый период для введенных параметров ЖК временно уточняется. Скорректируйте параметры и повторите расчет.`;
  } else {
    const ratio = info.max > MODEL_CONSTANTS.EPS ? state.planned / info.max : Infinity;
    if (ratio >= 1) {
      tone = '#F59E0B';
      text = `Текущий период находится на верхней границе рекомендуемого диапазона: ${fmtMonthsRange(info.min, info.max)}.`;
    } else if (ratio >= PLANNED_LIMIT_CONFIG.NOTE_WARNING_RATIO) {
      tone = '#F59E0B';
      text = `Текущий период близок к верхней границе рекомендуемого диапазона: ${fmtMonthsRange(info.min, info.max)}.`;
    }
  }

  node.style.color = tone;
  node.textContent = text;
}


function fmtPace(v) {
  if (!Number.isFinite(v)) return '—';
  return `${Number(v).toLocaleString('ru-RU', { maximumFractionDigits: 1 })} кв./мес.`;
}

function paceCriterionLabel(info = lastPaceLimitInfo) {
  if (PACE_LIMIT_CONFIG.REQUIRE_TARGET_ROI && Number.isFinite(PLANNED_LIMIT_CONFIG.MIN_ROI_X) && PLANNED_LIMIT_CONFIG.MIN_ROI_X > 0) {
    return `ROI ≥ ${rawNumber(PLANNED_LIMIT_CONFIG.MIN_ROI_X, 0)}x`;
  }
  return 'положительному ROI';
}

function updatePaceLimitNote(info) {
  const node = document.getElementById('pace-limit-note');
  if (!node || !info) return;

  const criterion = paceCriterionLabel(info);
  let tone = 'var(--gray-light)';
  let text = `Выполнимый диапазон темпа продаж: ${fmtPace(info.min)}–${fmtPace(info.max)}.`;

  if (!info.hasPositiveRoiPace) {
    tone = '#DC2626';
    text = `В текущем диапазоне темпа продаж не найдено значение с положительным ROI. Попробуйте изменить срок продаж, цену или кредит.`;
  } else if (PACE_LIMIT_CONFIG.REQUIRE_TARGET_ROI && !info.hasTargetRoiPace) {
    tone = '#F59E0B';
    text = `Целевой ROI недостижим по темпу; оставлен диапазон с положительным ROI: ${fmtPace(info.min)}–${fmtPace(info.max)}.`;
  } else {
    const span = Math.max(info.max - info.min, MODEL_CONSTANTS.EPS);
    const distanceFromMin = state.pace - info.min;
    if (distanceFromMin <= PACE_LIMIT_CONFIG.NOTE_WARNING_RATIO * span + MODEL_CONSTANTS.EPS) {
      tone = '#F59E0B';
      text = `Темп продаж близок к нижней границе по ${criterion}: ${fmtPace(info.min)}.`;
    }
  }

  node.style.color = tone;
  node.textContent = text;
}


function buildCoreParamsForAdaptivePeriod(values, plannedMonths) {
  const savedPlannedMin = SLIDER_LIMITS.planned.min;
  const savedPlannedMax = SLIDER_LIMITS.planned.max;
  const savedPaceMin = SLIDER_LIMITS.pace.min;
  const savedPaceMax = SLIDER_LIMITS.pace.max;
  const savedLoanMin = SLIDER_LIMITS.loan.min;
  const savedLoanMax = SLIDER_LIMITS.loan.max;

  try {
    SLIDER_LIMITS.planned.min = PLANNED_LIMIT_CONFIG.HARD_MIN_MONTHS;
    SLIDER_LIMITS.planned.max = PLANNED_LIMIT_CONFIG.HARD_MAX_MONTHS;
    // При сканировании planned и pace нельзя использовать уже суженные adaptive-границы pace,
    // иначе появится гистерезис: нижняя граница темпа сможет только расти, но не снижаться.
    SLIDER_LIMITS.pace.min = PACE_LIMIT_CONFIG.HARD_MIN;
    SLIDER_LIMITS.pace.max = PACE_LIMIT_CONFIG.HARD_MAX;
    // Аналогично для кредита: planned/pace/loan-сканы должны видеть технический диапазон,
    // а не предыдущий adaptive min/max.
    SLIDER_LIMITS.loan.min = LOAN_LIMIT_CONFIG.HARD_MIN_MLN;
    SLIDER_LIMITS.loan.max = LOAN_LIMIT_CONFIG.HARD_MAX_MLN;
    return buildCoreParams({ ...values, planned: plannedMonths });
  } finally {
    SLIDER_LIMITS.planned.min = savedPlannedMin;
    SLIDER_LIMITS.planned.max = savedPlannedMax;
    SLIDER_LIMITS.pace.min = savedPaceMin;
    SLIDER_LIMITS.pace.max = savedPaceMax;
    SLIDER_LIMITS.loan.min = savedLoanMin;
    SLIDER_LIMITS.loan.max = savedLoanMax;
  }
}

function interestForArithmeticEscrow(B0, monthlyRevenue, T, monthlyRate) {
  const B = Math.max(0, clampFinite(B0, 0));
  const R = Math.max(0, clampFinite(monthlyRevenue, 0));
  const r = Math.max(0, clampFinite(monthlyRate, 0));
  const N = Math.max(0, Math.floor(clampFinite(T, 0)));

  if (B <= MODEL_CONSTANTS.EPS || r <= MODEL_CONSTANTS.EPS || N <= 0) return 0;
  if (R <= MODEL_CONSTANTS.EPS) return r * B * N;

  // Месяцы n = 0,...,m-1 имеют startEscrow = nR < B.
  const m = Math.min(N, Math.max(0, Math.ceil(B / R - MODEL_CONSTANTS.EPS)));
  return r * (m * B - R * m * (m - 1) / 2);
}

function estimateBaseP0MetricsFast(params) {
  const T = params.plannedMonths;
  const unitRevenue = params.area * params.price / 1_000_000;
  const q0 = Math.max(0, params.pace);
  const monthlyRevenueFull = unitRevenue * q0;

  let X = 0;
  let E = 0;
  let interest = 0;

  // T <= 120, поэтому маленький численный цикл здесь дешевле и точнее, чем громоздкая формула с последним частичным месяцем.
  for (let n = 0; n < T; n++) {
    interest += params.monthlyRate * Math.max(params.loan - COVER * E, 0);
    const unitsSold = Math.min(q0, Math.max(params.lots - X, 0));
    X += unitsSold;
    E += unitsSold * unitRevenue;
    if (X >= params.lots - MODEL_CONSTANTS.MODEL_TOL && E >= params.loan - MODEL_CONSTANTS.MODEL_TOL) {
      // После sell-out и покрытия долга дальнейшие месяцы уже не меняют прибыль baseline.
      // Если долг не покрыт, цикл должен продолжаться, потому что проценты продолжают начисляться.
    }
  }

  return {
    finalSales: X,
    totalRevenue: E,
    totalInterest: interest,
    profitGross: E - params.loan - interest,
    profit: E - params.loan - interest
  };
}

function estimateFlatSelloutPeriodMetrics(values, plannedMonths) {
  const params = buildCoreParamsForAdaptivePeriod(values, plannedMonths);
  const demandParams = buildDemandParams(params);
  const T = params.plannedMonths;

  if (!(T > 0)) {
    return { feasible: false, netGain: -Infinity, roi: -Infinity, dpriceProfit: -Infinity, baseProfit: -Infinity };
  }

  const q = params.lots / T;
  if (q < demandParams.qMin - MODEL_CONSTANTS.MODEL_TOL) {
    return { feasible: false, reason: 'too_fast', netGain: -Infinity, roi: -Infinity, dpriceProfit: -Infinity, baseProfit: -Infinity };
  }
  if (q > demandParams.qMax + MODEL_CONSTANTS.MODEL_TOL) {
    return { feasible: false, reason: 'too_slow', netGain: -Infinity, roi: -Infinity, dpriceProfit: -Infinity, baseProfit: -Infinity };
  }

  // Baseline p_n = p0, быстро и без построения rows.
  const base = estimateBaseP0MetricsFast(params);

  // Reference DPrice: равномерный full sell-out за T месяцев.
  const price = inverseDemand(q, demandParams);
  const totalArea = params.lots * params.area;
  const totalRevenue = totalArea * price / 1_000_000;
  const monthlyRevenue = totalRevenue / T;
  const totalInterest = interestForArithmeticEscrow(params.loan, monthlyRevenue * COVER, T, params.monthlyRate);
  const dpriceCost = MODEL_CONSTANTS.DPRICE_ANNUAL_COST_MLN * T / 12;
  const dpriceProfitGross = totalRevenue - params.loan - totalInterest;
  const dpriceProfit = dpriceProfitGross - dpriceCost;

  const netGain = dpriceProfit - base.profit;
  const grossGain = dpriceProfitGross - base.profitGross;
  const roi = dpriceCost > MODEL_CONSTANTS.EPS ? netGain / dpriceCost : Infinity;

  return {
    feasible: true,
    q,
    price,
    baseProfit: base.profit,
    dpriceProfit,
    baseGross: base.profitGross,
    dpriceGross: dpriceProfitGross,
    grossGain,
    netGain,
    roi,
    baseFinalSales: base.finalSales,
    dpriceFinalSales: params.lots
  };
}

function estimateAdaptivePlannedLimit(values) {
  const hardMin = PLANNED_LIMIT_CONFIG.HARD_MIN_MONTHS;
  const hardMax = PLANNED_LIMIT_CONFIG.HARD_MAX_MONTHS;
  const params0 = buildCoreParamsForAdaptivePeriod(values, clampFinite(values.planned, state.planned));
  const demandParams = buildDemandParams(params0);

  const selloutMinRaw = Math.ceil(params0.lots / Math.max(demandParams.qMax, MODEL_CONSTANTS.EPS));
  const selloutMaxRaw = Math.floor(params0.lots / Math.max(demandParams.qMin, MODEL_CONSTANTS.EPS));
  const selloutMin = Math.max(1, selloutMinRaw);
  const selloutMax = Math.max(selloutMin, selloutMaxRaw);

  const scanMin = Math.max(hardMin, selloutMin);
  const scanMax = Math.min(hardMax, selloutMax);

  if (scanMin > scanMax) {
    const collapsed = selloutMin > hardMax ? hardMax : hardMin;
    return {
      min: collapsed,
      max: collapsed,
      selloutMin,
      selloutMax,
      positiveMin: null,
      positiveMax: null,
      targetMin: null,
      targetMax: null,
      profitMin: null,
      profitMax: null,
      bestProfit: -Infinity,
      bestRoi: -Infinity,
      hasFeasibleSelloutPeriod: false,
      hasPositiveProfitPeriod: false,
      source: 'sellout_infeasible'
    };
  }

  let firstPositive = null;
  let lastPositive = null;
  let firstTarget = null;
  let lastTarget = null;
  let bestNetGain = -Infinity;
  let bestRoi = -Infinity;
  let bestT = scanMin;

  const minRoi = Math.max(0, clampFinite(PLANNED_LIMIT_CONFIG.MIN_ROI_X, 0));
  const minNetGain = Math.max(0, clampFinite(PLANNED_LIMIT_CONFIG.MIN_NET_GAIN_MLN, 0));

  for (let T = scanMin; T <= scanMax; T++) {
    const metrics = estimateFlatSelloutPeriodMetrics(values, T);
    if (!metrics.feasible) continue;

    if (metrics.netGain > bestNetGain) {
      bestNetGain = metrics.netGain;
      bestRoi = metrics.roi;
      bestT = T;
    }

    if (metrics.netGain > MODEL_CONSTANTS.MODEL_TOL && metrics.roi > MODEL_CONSTANTS.MODEL_TOL) {
      if (firstPositive === null) firstPositive = T;
      lastPositive = T;
    }

    if (metrics.netGain > minNetGain + MODEL_CONSTANTS.MODEL_TOL && metrics.roi >= minRoi - MODEL_CONSTANTS.MODEL_TOL) {
      if (firstTarget === null) firstTarget = T;
      lastTarget = T;
    }
  }

  if (firstTarget !== null) {
    return {
      min: firstTarget,
      max: lastTarget,
      selloutMin,
      selloutMax,
      positiveMin: firstPositive,
      positiveMax: lastPositive,
      targetMin: firstTarget,
      targetMax: lastTarget,
      profitMin: firstTarget,
      profitMax: lastTarget,
      bestProfit: bestNetGain,
      bestRoi,
      bestT,
      hasFeasibleSelloutPeriod: true,
      hasPositiveProfitPeriod: true,
      source: minRoi > 0 ? 'target_roi_scan' : 'positive_roi_scan'
    };
  }

  if (firstPositive !== null) {
    return {
      min: firstPositive,
      max: lastPositive,
      selloutMin,
      selloutMax,
      positiveMin: firstPositive,
      positiveMax: lastPositive,
      targetMin: null,
      targetMax: null,
      profitMin: firstPositive,
      profitMax: lastPositive,
      bestProfit: bestNetGain,
      bestRoi,
      bestT,
      hasFeasibleSelloutPeriod: true,
      hasPositiveProfitPeriod: true,
      source: 'positive_roi_fallback'
    };
  }

  return {
    min: bestT,
    max: bestT,
    selloutMin,
    selloutMax,
    positiveMin: null,
    positiveMax: null,
    targetMin: null,
    targetMax: null,
    profitMin: null,
    profitMax: null,
    bestProfit: bestNetGain,
    bestRoi,
    bestT,
    hasFeasibleSelloutPeriod: true,
    hasPositiveProfitPeriod: false,
    source: 'roi_scan_no_positive'
  };
}


function buildCoreParamsForAdaptivePace(values, pace) {
  const savedMin = SLIDER_LIMITS.pace.min;
  const savedMax = SLIDER_LIMITS.pace.max;

  try {
    SLIDER_LIMITS.pace.min = PACE_LIMIT_CONFIG.HARD_MIN;
    SLIDER_LIMITS.pace.max = PACE_LIMIT_CONFIG.HARD_MAX;
    return buildCoreParams({ ...values, pace });
  } finally {
    SLIDER_LIMITS.pace.min = savedMin;
    SLIDER_LIMITS.pace.max = savedMax;
  }
}

function paceCandidates() {
  const out = [];
  const start = Math.round(PACE_LIMIT_CONFIG.HARD_MIN / PACE_LIMIT_CONFIG.STEP);
  const end = Math.round(PACE_LIMIT_CONFIG.HARD_MAX / PACE_LIMIT_CONFIG.STEP);
  for (let k = start; k <= end; k++) {
    out.push(Number((k * PACE_LIMIT_CONFIG.STEP).toFixed(6)));
  }
  return out;
}

function estimateAdaptivePaceLimit(values) {
  const hardMin = PACE_LIMIT_CONFIG.HARD_MIN;
  const hardMax = PACE_LIMIT_CONFIG.HARD_MAX;
  const step = PACE_LIMIT_CONFIG.STEP;
  const memo = new Map();

  const norm = pace => Number(clamp(pace, hardMin, hardMax).toFixed(6));
  const getInfo = pace => {
    const key = norm(pace).toFixed(6);
    if (!memo.has(key)) {
      memo.set(key, estimateAdaptivePlannedLimit({ ...values, pace: Number(key) }));
    }
    return memo.get(key);
  };

  const hasPositive = pace => {
    const info = getInfo(pace);
    return !!(info.hasPositiveProfitPeriod && info.positiveMin !== null);
  };

  const hasTarget = pace => {
    const info = getInfo(pace);
    return !!(info.hasPositiveProfitPeriod && info.targetMin !== null);
  };

  const findLowerBound = predicate => {
    if (predicate(hardMin)) return hardMin;
    if (!predicate(hardMax)) return null;

    let lo = hardMin;
    let hi = hardMax;
    for (let i = 0; i < 28; i++) {
      const mid = 0.5 * (lo + hi);
      if (predicate(mid)) hi = mid;
      else lo = mid;
    }

    // Привязка к шагу слайдера + локальная проверка, чтобы не получить ложноположительный min.
    let candidate = Math.ceil((hi - MODEL_CONSTANTS.EPS) / step) * step;
    candidate = norm(candidate);
    while (candidate <= hardMax + MODEL_CONSTANTS.EPS && !predicate(candidate)) {
      candidate = norm(candidate + step);
    }
    return candidate <= hardMax + MODEL_CONSTANTS.EPS ? candidate : null;
  };

  const positiveMin = findLowerBound(hasPositive);
  const targetMin = findLowerBound(hasTarget);
  const highInfo = getInfo(hardMax);
  const lowInfo = getInfo(hardMin);

  const bestInfo = highInfo.bestRoi >= lowInfo.bestRoi ? highInfo : lowInfo;
  const bestPace = highInfo.bestRoi >= lowInfo.bestRoi ? hardMax : hardMin;
  const bestRoi = Number.isFinite(bestInfo.bestRoi) ? bestInfo.bestRoi : -Infinity;
  const bestNetGain = Number.isFinite(bestInfo.bestProfit) ? bestInfo.bestProfit : -Infinity;

  const requireTarget = !!PACE_LIMIT_CONFIG.REQUIRE_TARGET_ROI;

  if (requireTarget && targetMin !== null) {
    return {
      min: targetMin,
      max: hardMax,
      positiveMin,
      positiveMax: positiveMin !== null ? hardMax : null,
      targetMin,
      targetMax: hardMax,
      bestPace,
      bestRoi,
      bestNetGain,
      hasPositiveRoiPace: positiveMin !== null,
      hasTargetRoiPace: true,
      source: 'target_roi_pace_bisect'
    };
  }

  if (positiveMin !== null) {
    return {
      min: positiveMin,
      max: hardMax,
      positiveMin,
      positiveMax: hardMax,
      targetMin,
      targetMax: targetMin !== null ? hardMax : null,
      bestPace,
      bestRoi,
      bestNetGain,
      hasPositiveRoiPace: true,
      hasTargetRoiPace: targetMin !== null,
      source: requireTarget ? 'positive_roi_pace_fallback_bisect' : 'positive_roi_pace_bisect'
    };
  }

  return {
    min: bestPace,
    max: bestPace,
    positiveMin: null,
    positiveMax: null,
    targetMin: null,
    targetMax: null,
    bestPace,
    bestRoi,
    bestNetGain,
    hasPositiveRoiPace: false,
    hasTargetRoiPace: false,
    source: 'pace_bisect_no_positive_roi'
  };
}

function updateAdaptivePaceLimit(values = state) {
  const info = estimateAdaptivePaceLimit(values);
  const step = SLIDER_LIMITS.pace.step;

  let sliderMin = Math.ceil((info.min - MODEL_CONSTANTS.EPS) / step) * step;
  let sliderMax = Math.floor((info.max + MODEL_CONSTANTS.EPS) / step) * step;

  sliderMin = clamp(sliderMin, PACE_LIMIT_CONFIG.HARD_MIN, PACE_LIMIT_CONFIG.HARD_MAX);
  sliderMax = clamp(sliderMax, PACE_LIMIT_CONFIG.HARD_MIN, PACE_LIMIT_CONFIG.HARD_MAX);

  if (sliderMax < sliderMin) sliderMax = sliderMin;

  SLIDER_LIMITS.pace.min = Number(sliderMin.toFixed(6));
  SLIDER_LIMITS.pace.max = Number(sliderMax.toFixed(6));

  if (state.pace < SLIDER_LIMITS.pace.min) state.pace = SLIDER_LIMITS.pace.min;
  if (state.pace > SLIDER_LIMITS.pace.max) state.pace = SLIDER_LIMITS.pace.max;

  lastPaceLimitInfo = {
    ...info,
    min: SLIDER_LIMITS.pace.min,
    max: SLIDER_LIMITS.pace.max
  };

  applySliderBounds();
  updatePaceLimitNote(lastPaceLimitInfo);

  return lastPaceLimitInfo;
}


function updateAdaptivePlannedLimit(values = state) {
  const info = estimateAdaptivePlannedLimit(values);
  const step = SLIDER_LIMITS.planned.step;

  let sliderMin = Math.ceil(info.min / step) * step;
  let sliderMax = Math.floor(info.max / step) * step;

  sliderMin = clamp(sliderMin, PLANNED_LIMIT_CONFIG.HARD_MIN_MONTHS, PLANNED_LIMIT_CONFIG.HARD_MAX_MONTHS);
  sliderMax = clamp(sliderMax, PLANNED_LIMIT_CONFIG.HARD_MIN_MONTHS, PLANNED_LIMIT_CONFIG.HARD_MAX_MONTHS);

  if (sliderMax < sliderMin) sliderMax = sliderMin;

  SLIDER_LIMITS.planned.min = sliderMin;
  SLIDER_LIMITS.planned.max = sliderMax;

  if (state.planned < sliderMin) state.planned = sliderMin;
  if (state.planned > sliderMax) state.planned = sliderMax;

  lastPlannedLimitInfo = {
    ...info,
    min: sliderMin,
    max: sliderMax
  };

  applySliderBounds();
  updatePlannedLimitNote(lastPlannedLimitInfo);

  return lastPlannedLimitInfo;
}


function buildCoreParamsForAdaptiveLoan(values, loanMln) {
  const savedLoanMin = SLIDER_LIMITS.loan.min;
  const savedLoanMax = SLIDER_LIMITS.loan.max;

  try {
    SLIDER_LIMITS.loan.min = LOAN_LIMIT_CONFIG.HARD_MIN_MLN;
    SLIDER_LIMITS.loan.max = LOAN_LIMIT_CONFIG.HARD_MAX_MLN;
    return buildCoreParams({ ...values, loan: loanMln });
  } finally {
    SLIDER_LIMITS.loan.min = savedLoanMin;
    SLIDER_LIMITS.loan.max = savedLoanMax;
  }
}

function estimateFlatSelloutLoanMetrics(values, loanMln) {
  const plannedMonths = Math.round(clampFinite(values.planned, state.planned));
  return estimateFlatSelloutPeriodMetrics({ ...values, loan: loanMln }, plannedMonths);
}

function estimateAdaptiveLoanRoiRange(values, rawProfitMax = LOAN_LIMIT_CONFIG.HARD_MAX_MLN) {
  const hardMin = LOAN_LIMIT_CONFIG.HARD_MIN_MLN;
  const hardMax = LOAN_LIMIT_CONFIG.HARD_MAX_MLN;
  const step = SLIDER_LIMITS.loan.step;
  const scanMax = Math.max(hardMin, Math.min(hardMax, clampFinite(rawProfitMax, hardMax)));
  const minRoi = Math.max(0, clampFinite(LOAN_LIMIT_CONFIG.MIN_ROI_X, 0));
  const minNetGain = Math.max(0, clampFinite(LOAN_LIMIT_CONFIG.MIN_NET_GAIN_MLN, 0));

  let firstGood = null;
  let lastGood = null;
  let bestLoan = hardMin;
  let bestRoi = -Infinity;
  let bestNetGain = -Infinity;
  let blockStarted = false;
  let blockEnded = false;

  for (let B = hardMin; B <= scanMax + MODEL_CONSTANTS.EPS; B += step) {
    const loan = Number(B.toFixed(6));
    const metrics = estimateFlatSelloutLoanMetrics(values, loan);

    if (Number.isFinite(metrics.roi) && metrics.roi > bestRoi) {
      bestRoi = metrics.roi;
      bestNetGain = metrics.netGain;
      bestLoan = loan;
    }

    const good = !!(
      metrics.feasible &&
      metrics.dpriceProfit > MODEL_CONSTANTS.MODEL_TOL &&
      metrics.netGain > minNetGain + MODEL_CONSTANTS.MODEL_TOL &&
      metrics.roi > minRoi + MODEL_CONSTANTS.MODEL_TOL
    );

    if (good && !blockEnded) {
      if (!blockStarted) {
        firstGood = loan;
        blockStarted = true;
      }
      lastGood = loan;
    } else if (blockStarted) {
      blockEnded = true;
      break;
    }
  }

  if (firstGood !== null) {
    return {
      rawMin: firstGood,
      rawMax: lastGood,
      roiMin: firstGood,
      roiMax: lastGood,
      bestLoan,
      bestRoi,
      bestNetGain,
      hasPositiveRoiLoan: true,
      source: 'flat_sellout_roi_loan_scan'
    };
  }

  return {
    rawMin: bestLoan,
    rawMax: bestLoan,
    roiMin: null,
    roiMax: null,
    bestLoan,
    bestRoi,
    bestNetGain,
    hasPositiveRoiLoan: false,
    source: 'loan_scan_no_positive_roi'
  };
}

function computeMaxLoanForPositiveProfitFromRows(rows, monthlyRate, dpriceCostMln) {
  if (!Array.isArray(rows) || !rows.length) return 0;

  const startEscrows = rows
    .map(row => COVER * Number(row.startEscrow))
    .filter(Number.isFinite)
    .sort((a, b) => a - b);

  if (!startEscrows.length) return 0;

  const finalEscrow = Number(rows[rows.length - 1].endEscrow);
  const r = Math.max(0, clampFinite(monthlyRate, 0));
  const c = Math.max(0, clampFinite(dpriceCostMln, 0));

  if (!Number.isFinite(finalEscrow) || finalEscrow - c <= MODEL_CONSTANTS.EPS) {
    return 0;
  }

  const profitAt = B0 => {
    let interest = 0;
    for (const E of startEscrows) {
      interest += r * Math.max(B0 - E, 0);
    }
    return finalEscrow - B0 - interest - c;
  };

  let prefixSum = 0;
  const T = startEscrows.length;

  for (let k = 0; k <= T; k++) {
    const numerator = finalEscrow - c + r * prefixSum;
    const denominator = 1 + r * k;
    const candidate = numerator / denominator;

    const left = k === 0 ? -Infinity : startEscrows[k - 1];
    const right = k === T ? Infinity : startEscrows[k];

    if (Number.isFinite(candidate) && candidate > left - 1e-7 && candidate <= right + 1e-7) {
      return Math.max(0, candidate);
    }

    if (k < T) prefixSum += startEscrows[k];
  }

  // Защитный fallback: монотонная бисекция по Pi(B0).
  let lo = 0;
  let hi = Math.max(finalEscrow - c, 0);

  if (profitAt(lo) <= 0) return 0;
  if (profitAt(hi) > 0) return hi;

  for (let i = 0; i < 80; i++) {
    const mid = 0.5 * (lo + hi);
    if (profitAt(mid) > 0) lo = mid;
    else hi = mid;
  }

  return Math.max(0, lo);
}

function buildFlatSelloutRows(params, demandParams) {
  const N = params.plannedMonths;
  const q = clamp(params.lots / Math.max(N, 1), demandParams.qMin, demandParams.qMax);
  const price = inverseDemand(q, demandParams);

  const rows = [];
  let X = 0;
  let E = 0;

  for (let n = 0; n < N; n++) {
    const startEscrow = E;
    const remainingLots = Math.max(params.lots - X, 0);
    const unitsSold = Math.min(q, remainingLots);
    const revenue = params.area * price * unitsSold / 1_000_000;
    X += unitsSold;
    E += revenue;
    rows.push({ month: n + 1, startEscrow, endEscrow: E, revenue });
  }

  return rows;
}

function estimateAdaptiveLoanLimit(values) {
  // Верхняя граница: DPrice-сценарий должен иметь строго положительную чистую прибыль.
  // Reference-модель не должна зависеть от текущего положения loan-слайдера.
  const referenceParams = buildCoreParamsForAdaptiveLoan(values, LOAN_LIMIT_CONFIG.HARD_MIN_MLN);
  referenceParams.loan = 0;

  const demandParams = buildDemandParams(referenceParams);
  const dpriceCost = MODEL_CONSTANTS.DPRICE_ANNUAL_COST_MLN * referenceParams.plannedMonths / 12;

  let rawProfitMax = 0;
  let upperSource = 'unknown';

  try {
    const basePolicy = buildBasePolicy(referenceParams, demandParams);
    const optCandidate = optimizeControlPolicy(referenceParams, demandParams, { baseUnits: basePolicy.units });
    rawProfitMax = computeMaxLoanForPositiveProfitFromRows(
      optCandidate.sim.rows,
      referenceParams.monthlyRate,
      dpriceCost
    );
    upperSource = `reference-${optCandidate.convergenceInfo.source}`;
  } catch (err) {
    if (!IS_CLIENT_MODE) {
      console.warn('Adaptive loan upper limit optimizer failed; fallback to flat sell-out.', err);
    }
    const fallbackRows = buildFlatSelloutRows(referenceParams, demandParams);
    rawProfitMax = computeMaxLoanForPositiveProfitFromRows(fallbackRows, referenceParams.monthlyRate, dpriceCost);
    upperSource = 'flat_sellout_profit_fallback';
  }

  if (!Number.isFinite(rawProfitMax) || rawProfitMax <= 0) {
    rawProfitMax = 0;
  }

  // Нижняя граница: ROI относительно baseline p0 должен быть строго положительным.
  const roiRange = estimateAdaptiveLoanRoiRange(values, rawProfitMax);
  let rawMin = roiRange.hasPositiveRoiLoan ? roiRange.rawMin : roiRange.bestLoan;
  let rawMax = roiRange.hasPositiveRoiLoan ? Math.min(rawProfitMax, roiRange.rawMax) : roiRange.bestLoan;

  if (!Number.isFinite(rawMin)) rawMin = LOAN_LIMIT_CONFIG.HARD_MIN_MLN;
  if (!Number.isFinite(rawMax)) rawMax = rawMin;
  if (rawMax < rawMin) rawMax = rawMin;

  return {
    rawMin,
    rawMax,
    rawProfitMax,
    roiMin: roiRange.roiMin,
    roiMax: roiRange.roiMax,
    bestLoan: roiRange.bestLoan,
    bestRoi: roiRange.bestRoi,
    bestNetGain: roiRange.bestNetGain,
    hasPositiveRoiLoan: roiRange.hasPositiveRoiLoan,
    source: `${upperSource}; ${roiRange.source}`
  };
}

function updateAdaptiveLoanLimit(values = state) {
  const step = SLIDER_LIMITS.loan.step;
  const hardMin = LOAN_LIMIT_CONFIG.HARD_MIN_MLN;
  const hardMax = LOAN_LIMIT_CONFIG.HARD_MAX_MLN;
  const info = estimateAdaptiveLoanLimit(values);

  const finiteRawMin = Number.isFinite(info.rawMin) ? Math.max(hardMin, info.rawMin) : hardMin;
  const finiteRawMax = Number.isFinite(info.rawMax) ? Math.max(finiteRawMin, info.rawMax) : finiteRawMin;
  const cappedMax = Math.min(finiteRawMax, hardMax);

  let sliderMin = Math.ceil((finiteRawMin - MODEL_CONSTANTS.EPS) / step) * step;
  let sliderMax = Math.floor((cappedMax + MODEL_CONSTANTS.EPS) / step) * step;

  // Если верхний предел задан именно корнем Pi(B0)=0, не даём попасть в точку нулевой прибыли.
  if (Number.isFinite(info.rawProfitMax) && sliderMax >= info.rawProfitMax - LOAN_LIMIT_CONFIG.STRICT_EPS_MLN) {
    sliderMax -= step;
  }

  sliderMin = Math.max(hardMin, Math.min(hardMax, sliderMin));
  sliderMax = Math.max(sliderMin, Math.min(hardMax, sliderMax));

  SLIDER_LIMITS.loan.min = sliderMin;
  SLIDER_LIMITS.loan.max = sliderMax;

  if (state.loan < sliderMin) {
    state.loan = sliderMin;
  }
  if (state.loan > sliderMax) {
    state.loan = sliderMax;
  }

  lastLoanLimitInfo = {
    ...info,
    rawMin: finiteRawMin,
    rawMax: finiteRawMax,
    sliderMin,
    sliderMax,
    isBelowUiMin: finiteRawMax < hardMin,
    cappedByHardMax: finiteRawMax > hardMax,
    source: info.source
  };

  applySliderBounds();
  updateLoanLimitNote(lastLoanLimitInfo);

  return lastLoanLimitInfo;
}

function applyAdaptiveSliderBounds() {
  const before = { loan: state.loan, planned: state.planned, pace: state.pace };

  // Порядок важен: pace задаёт форму спроса, planned зависит от pace и loan, loan зависит от planned.
  updateAdaptivePaceLimit(state);
  updateAdaptivePlannedLimit(state);
  updateAdaptiveLoanLimit(state);

  // После clamp кредита или темпа допустимый диапазон периода может измениться.
  if (
    Math.abs(state.loan - before.loan) > MODEL_CONSTANTS.EPS ||
    Math.abs(state.pace - before.pace) > MODEL_CONSTANTS.EPS ||
    Math.abs(state.planned - before.planned) > MODEL_CONSTANTS.EPS
  ) {
    updateAdaptivePaceLimit(state);
    updateAdaptivePlannedLimit(state);
    updateAdaptiveLoanLimit(state);
  }
}

function syncInput(key, val) {
  state[key] = parseFloat(val);
  const input = document.getElementById('i-' + key);
  if (input) input.value = String(val);
  applySliderBounds();
  scheduleRecalc();
}

function syncRange(key, val) {
  state[key] = parseFloat(val);
  const range = document.getElementById('r-' + key);
  if (range) {
    range.value = String(val);
    updateSliderGradient(range);
  }
  const input = document.getElementById('i-' + key);
  if (input) input.value = String(val);
  applySliderBounds();
  scheduleRecalc();
}

function fmtMln(v) {
  if (!Number.isFinite(v)) return '—';
  const sign = v < 0 ? '−' : '';
  const x = Math.abs(v);
  if (x >= 1000) return `${sign}${(x / 1000).toFixed(2)} млрд ₽`;
  return `${sign}${x.toFixed(1)} млн ₽`;
}

function fmtPriceM2(v) {
  if (!Number.isFinite(v)) return '—';
  return `${new Intl.NumberFormat('ru-RU').format(Math.round(v))} ₽/м²`;
}

function fmtX(v) {
  if (!Number.isFinite(v)) return '—';
  return `${v.toFixed(2)}x`;
}

function fmtMonth(v) {
  if (!Number.isFinite(v)) return '—';
  return `${v.toFixed(1)} мес.`;
}

function fmtMonthInt(v) {
  if (!Number.isFinite(v)) return '—';
  return `${Math.round(v)} мес.`;
}

function rawNumber(v, digits = 3) {
  if (!Number.isFinite(v)) return '—';
  return Number(v).toLocaleString('ru-RU', { maximumFractionDigits: digits });
}

function rawSigned(v, digits = 3, suffix = '') {
  if (!Number.isFinite(v)) return '—';
  const sign = v >= 0 ? '+' : '−';
  const body = Math.abs(v).toLocaleString('ru-RU', { maximumFractionDigits: digits });
  return `${sign}${body}${suffix ? ` ${suffix}` : ''}`;
}

function maxAbsDiff(a, b) {
  const n = Math.min(a.length, b.length);
  let maxDiff = 0;
  for (let i = 0; i < n; i++) {
    const diff = Math.abs((a[i] || 0) - (b[i] || 0));
    if (diff > maxDiff) maxDiff = diff;
  }
  return maxDiff;
}

function hasNaNOrInfinity(values) {
  for (let i = 0; i < values.length; i++) {
    if (!Number.isFinite(values[i])) return true;
  }
  return false;
}

function getDynamicPriceBounds(p0) {
  const priceMin = MODEL_CONSTANTS.PRICE_POLICY_MIN;
  const safeP0 = clampFinite(p0, priceMin);
  const rawPriceMax = 2 * safeP0 + MODEL_CONSTANTS.PRICE_POLICY_MIN;
  const priceMax = Number.isFinite(rawPriceMax) ? Math.max(priceMin, rawPriceMax) : priceMin;
  return { priceMin, priceMax };
}

function buildCoreParams(values) {
  const lots = Math.round(stepClamp(values.lots, SLIDER_LIMITS.lots.min, SLIDER_LIMITS.lots.max, SLIDER_LIMITS.lots.step));
  const area = stepClamp(values.area, SLIDER_LIMITS.area.min, SLIDER_LIMITS.area.max, SLIDER_LIMITS.area.step);
  const price = stepClamp(values.price, SLIDER_LIMITS.price.min, SLIDER_LIMITS.price.max, SLIDER_LIMITS.price.step);
  const loan = stepClamp(values.loan, SLIDER_LIMITS.loan.min, SLIDER_LIMITS.loan.max, SLIDER_LIMITS.loan.step);
  const rate = stepClamp(values.rate, SLIDER_LIMITS.rate.min, SLIDER_LIMITS.rate.max, SLIDER_LIMITS.rate.step);
  const plannedMonths = Math.round(stepClamp(values.planned, SLIDER_LIMITS.planned.min, SLIDER_LIMITS.planned.max, SLIDER_LIMITS.planned.step));
  const pace = stepClamp(values.pace, SLIDER_LIMITS.pace.min, SLIDER_LIMITS.pace.max, SLIDER_LIMITS.pace.step);

  const annualRate = rate / 100;
  const monthlyRate = Math.pow(1 + annualRate, 1 / 12) - 1;
  const { priceMin, priceMax } = getDynamicPriceBounds(price);

  return {
    lots,
    area,
    price,
    loan,
    rate,
    plannedMonths,
    pace,
    annualRate,
    monthlyRate,
    PRICE_POLICY_MIN: priceMin,
    PRICE_POLICY_MAX: priceMax,
    DEMAND_EPS: MODEL_CONSTANTS.DEMAND_EPS,
    DPRICE_ANNUAL_COST_MLN: MODEL_CONSTANTS.DPRICE_ANNUAL_COST_MLN,
    dpriceMonthlyCostMln: MODEL_CONSTANTS.DPRICE_ANNUAL_COST_MLN / 12
  };
}

function logisticV(priceM2, demandParams) {
  const z = clamp(demandParams.a - demandParams.b * priceM2, -60, 60);
  return 1 / (1 + Math.exp(-z));
}

function expectedUnits(priceM2, demandParams) {
  return demandParams.lambda * logisticV(priceM2, demandParams);
}

function buildDemandParams(params) {
  const eps = clamp(MODEL_CONSTANTS.DEMAND_EPS, 1e-6, 0.49);
  const priceMin = params.PRICE_POLICY_MIN;
  const priceMax = params.PRICE_POLICY_MAX;
  const priceSpan = Math.max(priceMax - priceMin, MODEL_CONSTANTS.EPS);
  const logitEps = Math.log(eps / (1 - eps));
  const b = -2 * logitEps / priceSpan;
  const a = b * priceMax + logitEps;

  const temp = { a, b };
  const v0 = logisticV(params.price, temp);
  const lambda = params.pace / Math.max(v0, MODEL_CONSTANTS.EPS);

  const demandParams = {
    a,
    b,
    lambda,
    demandEps: eps,
    logitEps,
    priceMin,
    priceMax,
    v0,
    q0: params.pace,
    p0: params.price,
    vClampMin: MODEL_CONSTANTS.EPS,
    vClampMax: 1 - MODEL_CONSTANTS.EPS
  };

  demandParams.qMin = expectedUnits(priceMax, demandParams);
  demandParams.qMax = expectedUnits(priceMin, demandParams);

  return demandParams;
}

function inverseDemand(unitsPerMonth, demandParams) {
  if (!(demandParams.lambda > MODEL_CONSTANTS.EPS) || !(demandParams.b > MODEL_CONSTANTS.EPS)) {
    return clamp(demandParams.p0, demandParams.priceMin, demandParams.priceMax);
  }
  const vRaw = unitsPerMonth / demandParams.lambda;
  const v = clamp(vRaw, demandParams.vClampMin, demandParams.vClampMax);
  const p = (demandParams.a - safeLogit(v, MODEL_CONSTANTS.EPS)) / demandParams.b;
  return clamp(p, demandParams.priceMin, demandParams.priceMax);
}

function revenueForUnits(units, params, demandParams) {
  const price = inverseDemand(units, demandParams);
  return params.area * price * units / 1_000_000;
}

function finiteDiffMarginalRevenue(units, params, demandParams) {
  const h = Math.max(1e-5, Math.abs(units) * 1e-4);
  const qPlus = units + h;
  const qMinus = Math.max(units - h, MODEL_CONSTANTS.EPS);
  const rp = revenueForUnits(qPlus, params, demandParams);
  const rm = revenueForUnits(qMinus, params, demandParams);
  return (rp - rm) / Math.max((qPlus - qMinus), MODEL_CONSTANTS.EPS);
}

function marginalRevenueForUnits(units, params, demandParams) {
  const q = Math.max(units, MODEL_CONSTANTS.EPS);
  const lambda = Math.max(demandParams.lambda, MODEL_CONSTANTS.EPS);
  const v = clamp(q / lambda, MODEL_CONSTANTS.EPS, 1 - MODEL_CONSTANTS.EPS);
  const p = (demandParams.a - safeLogit(v, MODEL_CONSTANTS.EPS)) / demandParams.b;

  if (!(demandParams.b > MODEL_CONSTANTS.EPS)) {
    return finiteDiffMarginalRevenue(q, params, demandParams);
  }

  const denom = demandParams.b * Math.max(1 - v, MODEL_CONSTANTS.EPS);
  const mr = (params.area / 1_000_000) * (p - 1 / denom);

  if (!Number.isFinite(mr)) {
    return finiteDiffMarginalRevenue(q, params, demandParams);
  }
  return mr;
}

function simulatePolicy(prices, params, demandParams, options = {}) {
  const N = params.plannedMonths;
  const rows = [];
  const warnings = [];
  const withDPrice = !!options.withDPrice;
  const monthlyDpriceCost = withDPrice ? MODEL_CONSTANTS.DPRICE_ANNUAL_COST_MLN / 12 : 0;

  let X = 0;
  let E = 0;
  let I = 0;
  let totalRevenue = 0;
  let dpriceCostToDate = 0;
  let debtFreeMonth = null;
  let soldOutMonth = null;
  let weightedPrice = 0;

  for (let n = 0; n < N; n++) {
    const startEscrow = E;
    const uncoveredDebt = Math.max(params.loan - COVER * startEscrow, 0);
    const interest = params.monthlyRate * uncoveredDebt;

    const pRaw = prices[n] ?? prices[prices.length - 1] ?? params.price;
    const price = clamp(clampFinite(pRaw, params.price), params.PRICE_POLICY_MIN, params.PRICE_POLICY_MAX);
    const unitsDemand = expectedUnits(price, demandParams);
    const remainingLots = Math.max(params.lots - X, 0);
    const unitsSold = Math.min(unitsDemand, remainingLots);
    const revenue = params.area * price * unitsSold / 1_000_000;

    if (!Number.isFinite(unitsSold) || !Number.isFinite(revenue) || !Number.isFinite(interest)) {
      warnings.push('Обнаружены некорректные численные значения в simulatePolicy.');
      break;
    }

    I += interest;
    X += unitsSold;
    E += revenue;
    totalRevenue += revenue;
    weightedPrice += price * unitsSold;

    if (withDPrice) dpriceCostToDate += monthlyDpriceCost;

    if (soldOutMonth === null && X >= params.lots - 1e-6) soldOutMonth = n + 1;
    if (debtFreeMonth === null && COVER * E >= params.loan - 1e-9) debtFreeMonth = n + 1;

    const profitGrossToDate = E - params.loan - I;
    const profitNetToDate = profitGrossToDate - dpriceCostToDate;

    rows.push({
      month: n + 1,
      price,
      unitsSold,
      revenue,
      startEscrow,
      uncoveredDebt,
      interest,
      endEscrow: E,
      cumulativeInterest: I,
      cumulativeSales: X,
      dpriceCostAccrued: dpriceCostToDate,
      profitGrossToDate,
      profitNetToDate,
      cumulativeProfitGross: profitGrossToDate,
      cumulativeProfit: profitNetToDate
    });
  }

  const dpriceCost = monthlyDpriceCost * N;
  const profitGross = E - params.loan - I;
  const profit = profitGross - dpriceCost;

  return {
    rows,
    finalSales: X,
    totalRevenue,
    totalEscrow: E,
    totalInterest: I,
    profitGross,
    dpriceCost,
    profit,
    avgPriceM2: X > MODEL_CONSTANTS.EPS ? (weightedPrice / X) : NaN,
    salesDuration: soldOutMonth ?? N,
    debtFreeMonth,
    warnings
  };
}

function simulateUnitsPolicy(units, params, demandParams, options = {}) {
  const N = params.plannedMonths;
  const rows = [];
  const warnings = [];
  const withDPrice = !!options.withDPrice;
  const monthlyDpriceCost = withDPrice ? MODEL_CONSTANTS.DPRICE_ANNUAL_COST_MLN / 12 : 0;

  const qMin = demandParams.qMin;
  const qMax = demandParams.qMax;

  let X = 0;
  let E = 0;
  let I = 0;
  let totalRevenue = 0;
  let dpriceCostToDate = 0;
  let debtFreeMonth = null;
  let soldOutMonth = null;
  let weightedPrice = 0;

  for (let n = 0; n < N; n++) {
    const startEscrow = E;
    const uncoveredDebt = Math.max(params.loan - COVER * startEscrow, 0);
    const interest = params.monthlyRate * uncoveredDebt;

    const qRaw = units[n] ?? units[units.length - 1] ?? (params.lots / N);
    const qTarget = clamp(clampFinite(qRaw, params.lots / N), qMin, qMax);
    const remainingLots = Math.max(params.lots - X, 0);
    const q = Math.min(qTarget, remainingLots);
    const price = inverseDemand(qTarget, demandParams);
    const revenue = params.area * price * q / 1_000_000;

    if (!Number.isFinite(q) || !Number.isFinite(price) || !Number.isFinite(revenue) || !Number.isFinite(interest)) {
      warnings.push('Обнаружены некорректные численные значения в simulateUnitsPolicy.');
      break;
    }

    I += interest;
    X += q;
    E += revenue;
    totalRevenue += revenue;
    weightedPrice += price * q;

    if (withDPrice) dpriceCostToDate += monthlyDpriceCost;

    if (soldOutMonth === null && X >= params.lots - 1e-6) soldOutMonth = n + 1;
    if (debtFreeMonth === null && COVER * E >= params.loan - 1e-9) debtFreeMonth = n + 1;

    const profitGrossToDate = E - params.loan - I;
    const profitNetToDate = profitGrossToDate - dpriceCostToDate;

    rows.push({
      month: n + 1,
      price,
      unitsSold: q,
      revenue,
      startEscrow,
      uncoveredDebt,
      interest,
      endEscrow: E,
      cumulativeInterest: I,
      cumulativeSales: X,
      dpriceCostAccrued: dpriceCostToDate,
      profitGrossToDate,
      profitNetToDate,
      cumulativeProfitGross: profitGrossToDate,
      cumulativeProfit: profitNetToDate
    });
  }

  const dpriceCost = monthlyDpriceCost * N;
  const profitGross = E - params.loan - I;
  const profit = profitGross - dpriceCost;

  return {
    rows,
    finalSales: X,
    totalRevenue,
    totalEscrow: E,
    totalInterest: I,
    profitGross,
    dpriceCost,
    profit,
    avgPriceM2: X > MODEL_CONSTANTS.EPS ? (weightedPrice / X) : NaN,
    salesDuration: soldOutMonth ?? N,
    debtFreeMonth,
    warnings
  };
}

function buildBasePolicy(params, demandParams) {
  const N = params.plannedMonths;
  const warnings = [];
  const pBase = clamp(params.price, params.PRICE_POLICY_MIN, params.PRICE_POLICY_MAX);
  const qBase = expectedUnits(pBase, demandParams);
  const potentialSales = qBase * N;

  if (potentialSales < params.lots - 0.5) {
    warnings.push('Базовый сценарий без DPrice держит текущую цену p₀ и не распродаёт все лоты за плановый горизонт.');
  }
  if (potentialSales > params.lots + 0.5) {
    warnings.push('Базовый сценарий без DPrice держит текущую цену p₀ и распродаёт объект раньше планового горизонта; продажи после sell-out обнуляются.');
  }

  return {
    prices: Array(N).fill(pBase),
    units: Array(N).fill(qBase),
    warnings
  };
}

function projectUnitsToSellout(units, target, qMin, qMax) {
  const out = units.map(q => clamp(clampFinite(q, target / Math.max(units.length, 1)), qMin, qMax));
  const tol = MODEL_CONSTANTS.MODEL_TOL;

  for (let iter = 0; iter < MODEL_CONSTANTS.PROJECTION_ITERS; iter++) {
    const sum = out.reduce((a, b) => a + b, 0);
    const diff = target - sum;
    if (Math.abs(diff) <= tol) break;

    if (diff > 0) {
      const idx = out.map((v, i) => ({ v, i })).filter(x => x.v < qMax - tol).map(x => x.i);
      if (!idx.length) break;
      const totalCap = idx.reduce((acc, i) => acc + (qMax - out[i]), 0);
      if (totalCap <= tol) break;
      const need = Math.min(diff, totalCap);
      let remain = need;
      for (let k = 0; k < idx.length; k++) {
        const i = idx[k];
        const share = remain / (idx.length - k);
        const add = Math.min(qMax - out[i], share);
        out[i] += add;
        remain -= add;
      }
    } else {
      const idx = out.map((v, i) => ({ v, i })).filter(x => x.v > qMin + tol).map(x => x.i);
      if (!idx.length) break;
      const totalCap = idx.reduce((acc, i) => acc + (out[i] - qMin), 0);
      if (totalCap <= tol) break;
      const need = Math.min(-diff, totalCap);
      let remain = need;
      for (let k = 0; k < idx.length; k++) {
        const i = idx[k];
        const share = remain / (idx.length - k);
        const sub = Math.min(out[i] - qMin, share);
        out[i] -= sub;
        remain -= sub;
      }
    }
  }

  return out;
}

function computeShadowWeights(sim, params) {
  const N = params.plannedMonths;
  const starts = sim.rows.map(row => row.startEscrow);
  const weights = Array(N).fill(1);

  for (let j = 0; j < N; j++) {
    let uncoveredCount = 0;
    for (let n = j + 1; n < N; n++) {
      if (COVER * (starts[n] ?? params.loan / COVER) < params.loan - MODEL_CONSTANTS.MODEL_TOL) uncoveredCount += 1;
    }
    weights[j] = 1 + COVER * params.monthlyRate * uncoveredCount;
  }

  return weights;
}

function solveUnitForMu(weight, mu, qMin, qMax, params, demandParams) {
  const gMin = weight * marginalRevenueForUnits(qMin, params, demandParams);
  const gMax = weight * marginalRevenueForUnits(qMax, params, demandParams);

  if (!Number.isFinite(gMin) || !Number.isFinite(gMax)) {
    return 0.5 * (qMin + qMax);
  }

  if (mu >= gMin) return qMin;
  if (mu <= gMax) return qMax;

  let lo = qMin;
  let hi = qMax;
  for (let i = 0; i < MODEL_CONSTANTS.BISECTION_ITERS; i++) {
    const mid = 0.5 * (lo + hi);
    const gMid = weight * marginalRevenueForUnits(mid, params, demandParams);
    if (!Number.isFinite(gMid)) {
      lo = mid;
      continue;
    }
    if (gMid > mu) lo = mid;
    else hi = mid;
  }
  return 0.5 * (lo + hi);
}

function allocateUnitsGivenWeights(weights, params, demandParams, targetLots = params.lots) {
  const N = params.plannedMonths;
  const qMin = demandParams.qMin;
  const qMax = demandParams.qMax;

  if (targetLots <= N * qMin + MODEL_CONSTANTS.MODEL_TOL) return Array(N).fill(qMin);
  if (targetLots >= N * qMax - MODEL_CONSTANTS.MODEL_TOL) return Array(N).fill(qMax);

  const w = weights.length === N ? weights.slice() : Array(N).fill(1);
  let muLow = Infinity;
  let muHigh = -Infinity;

  for (let j = 0; j < N; j++) {
    const wj = Math.max(w[j], MODEL_CONSTANTS.EPS);
    const low = wj * marginalRevenueForUnits(qMax, params, demandParams);
    const high = wj * marginalRevenueForUnits(qMin, params, demandParams);
    if (Number.isFinite(low)) muLow = Math.min(muLow, low);
    if (Number.isFinite(high)) muHigh = Math.max(muHigh, high);
  }

  if (!Number.isFinite(muLow) || !Number.isFinite(muHigh) || muLow >= muHigh) {
    return projectUnitsToSellout(Array(N).fill(targetLots / N), targetLots, qMin, qMax);
  }

  let best = Array(N).fill(targetLots / N);
  for (let i = 0; i < MODEL_CONSTANTS.BISECTION_ITERS; i++) {
    const mu = 0.5 * (muLow + muHigh);
    const units = w.map(wj => solveUnitForMu(Math.max(wj, MODEL_CONSTANTS.EPS), mu, qMin, qMax, params, demandParams));
    const sum = units.reduce((a, b) => a + b, 0);
    best = units;

    if (sum > targetLots) muLow = mu;
    else muHigh = mu;
  }

  return projectUnitsToSellout(best, targetLots, qMin, qMax);
}

function projectedCoordinateSearch(initialUnits, params, demandParams, targetLots) {
  const N = params.plannedMonths;
  const qMin = demandParams.qMin;
  const qMax = demandParams.qMax;
  let units = projectUnitsToSellout(initialUnits, targetLots, qMin, qMax);

  const objective = sim => sim.totalEscrow - sim.totalInterest;
  let bestSim = simulateUnitsPolicy(units, params, demandParams, { withDPrice: true });
  let bestObj = objective(bestSim);

  for (let pass = 0; pass < 4; pass++) {
    let improved = false;
    const delta = Math.max(0.05, (qMax - qMin) / 80);

    for (let i = 0; i < N - 1; i++) {
      for (let j = i + 1; j < N; j++) {
        const candidates = [
          { from: j, to: i },
          { from: i, to: j }
        ];

        for (const move of candidates) {
          const trial = units.slice();
          const moveCap = Math.min(trial[move.from] - qMin, qMax - trial[move.to]);
          if (moveCap <= MODEL_CONSTANTS.MODEL_TOL) continue;
          const d = Math.min(delta, moveCap);
          trial[move.from] -= d;
          trial[move.to] += d;

          const sim = simulateUnitsPolicy(trial, params, demandParams, { withDPrice: true });
          const obj = objective(sim);
          if (Number.isFinite(obj) && obj > bestObj + 1e-7) {
            units = trial;
            bestSim = sim;
            bestObj = obj;
            improved = true;
          }
        }
      }
    }

    if (!improved) break;
  }

  return {
    units,
    sim: bestSim
  };
}

function optimizeControlPolicy(params, demandParams, options = {}) {
  const N = params.plannedMonths;
  const qMin = demandParams.qMin;
  const qMax = demandParams.qMax;
  const warnings = [];

  const minTotal = N * qMin;
  const maxTotal = N * qMax;

  let targetLots = params.lots;
  let feasibleSellout = true;
  if (params.lots < minTotal - MODEL_CONSTANTS.MODEL_TOL || params.lots > maxTotal + MODEL_CONSTANTS.MODEL_TOL) {
    feasibleSellout = false;
    warnings.push('При текущей модели спроса и границах цены невозможно продать ровно S лотов за T месяцев. Проверьте planned, pace, price или диапазон цены.');
    targetLots = clamp(params.lots, minTotal, maxTotal);
  }

  const baseUnitsRaw = Array.isArray(options.baseUnits) && options.baseUnits.length === N
    ? options.baseUnits.slice()
    : Array(N).fill(clamp(params.lots / N, qMin, qMax));
  const baseUnitsProjected = projectUnitsToSellout(baseUnitsRaw, targetLots, qMin, qMax);
  const baseSimCandidate = simulateUnitsPolicy(baseUnitsProjected, params, demandParams, { withDPrice: true });

  let best = {
    source: 'base_candidate',
    units: baseUnitsProjected,
    sim: baseSimCandidate
  };

  let units = Array(N).fill(clamp(targetLots / N, qMin, qMax));
  units = projectUnitsToSellout(units, targetLots, qMin, qMax);

  let converged = false;
  let iterCount = 0;
  let lastObjective = -Infinity;
  let hadNumericIssue = false;

  for (let iter = 0; iter < MODEL_CONSTANTS.MAX_OPT_ITER; iter++) {
    iterCount = iter + 1;
    const sim = simulateUnitsPolicy(units, params, demandParams, { withDPrice: true });
    const objective = sim.totalEscrow - sim.totalInterest;

    if (!Number.isFinite(objective)) {
      hadNumericIssue = true;
      break;
    }

    const weights = computeShadowWeights(sim, params);
    const candidateUnits = allocateUnitsGivenWeights(weights, params, demandParams, targetLots);

    const mixed = candidateUnits.map((q, i) => 0.65 * q + 0.35 * units[i]);
    const normalized = projectUnitsToSellout(mixed, targetLots, qMin, qMax);

    const diff = maxAbsDiff(normalized, units);
    const candidateSim = simulateUnitsPolicy(normalized, params, demandParams, { withDPrice: true });
    const candidateObjective = candidateSim.totalEscrow - candidateSim.totalInterest;

    units = normalized;

    if (!Number.isFinite(candidateObjective)) {
      hadNumericIssue = true;
      break;
    }

    const objectiveDelta = Math.abs(candidateObjective - lastObjective);
    lastObjective = candidateObjective;

    if (diff < 1e-5 || objectiveDelta < 1e-7) {
      converged = true;
      break;
    }
  }

  if (hadNumericIssue) {
    warnings.push('Оптимизатор столкнулся с численной нестабильностью; показан fallback-сценарий.');
    const fallback = projectedCoordinateSearch(units, params, demandParams, targetLots);
    units = fallback.units;
  }

  let sim = simulateUnitsPolicy(units, params, demandParams, { withDPrice: true });

  if (!Number.isFinite(sim.profit) || sim.rows.some(row => !Number.isFinite(row.price) || !Number.isFinite(row.revenue))) {
    warnings.push('В расчетах возникли NaN/Infinity; использован fallback base-as-candidate.');
    units = baseUnitsProjected.slice();
    sim = simulateUnitsPolicy(units, params, demandParams, { withDPrice: true });
  }

  if (sim.profitGross > best.sim.profitGross + MODEL_CONSTANTS.GROSS_TOL) {
    best = {
      source: 'optimized',
      units,
      sim
    };
  } else if (sim.profitGross < best.sim.profitGross - MODEL_CONSTANTS.GROSS_TOL) {
    warnings.push('Оптимизатор дал результат хуже базовой допустимой стратегии. Применён fallback base-as-candidate.');
  }

  if (!converged) {
    warnings.push('Оптимизатор не достиг строгой сходимости, показано лучшее найденное решение.');
  }

  if (Math.abs(best.sim.finalSales - params.lots) > 0.5) {
    warnings.push('Терминальное ограничение X_T = S выполнено приближённо.');
  }

  const prices = best.units.map(q => inverseDemand(q, demandParams));

  return {
    source: best.source,
    prices,
    units: best.units,
    sim: best.sim,
    warnings,
    convergenceInfo: {
      converged,
      iterations: iterCount,
      targetLots,
      minTotal,
      maxTotal,
      feasibleSellout,
      source: best.source,
      numericIssue: hadNumericIssue
    }
  };
}

function collectInvariantViolations(simName, sim, params, withDPrice) {
  const warnings = [];
  const details = [];
  const tol = MODEL_CONSTANTS.MODEL_TOL;

  const rowKeys = ['price', 'unitsSold', 'revenue', 'startEscrow', 'endEscrow', 'uncoveredDebt', 'interest', 'cumulativeInterest', 'cumulativeSales', 'profitGrossToDate', 'profitNetToDate'];
  let prevSales = -Infinity;

  for (let i = 0; i < sim.rows.length; i++) {
    const row = sim.rows[i];
    const values = rowKeys.map(k => row[k]);
    if (hasNaNOrInfinity(values)) {
      warnings.push(`${simName}: обнаружены NaN/Infinity в строках таблицы.`);
      details.push({ simName, type: 'finite', row: row.month, values });
      break;
    }

    if (row.interest < -tol) {
      warnings.push(`${simName}: найдены отрицательные проценты.`);
      details.push({ simName, type: 'interest_nonnegative', row: row.month, interest: row.interest });
    }

    if (row.endEscrow + tol < row.startEscrow) {
      warnings.push(`${simName}: escrow не монотонен.`);
      details.push({ simName, type: 'escrow_monotone', row: row.month, startEscrow: row.startEscrow, endEscrow: row.endEscrow });
    }

    if (row.cumulativeSales + tol < prevSales) {
      warnings.push(`${simName}: cumulative sales не монотонны.`);
      details.push({ simName, type: 'sales_monotone', row: row.month, prevSales, currentSales: row.cumulativeSales });
    }

    const expectedUncovered = Math.max(params.loan - COVER * row.startEscrow, 0);
    if (Math.abs(row.uncoveredDebt - expectedUncovered) > 1e-5) {
      warnings.push(`${simName}: нарушена формула uncovered debt.`);
      details.push({ simName, type: 'uncovered_debt', row: row.month, actual: row.uncoveredDebt, expected: expectedUncovered });
    }

    const expectedInterest = params.monthlyRate * row.uncoveredDebt;
    if (Math.abs(row.interest - expectedInterest) > 1e-5) {
      warnings.push(`${simName}: нарушена формула процентов.`);
      details.push({ simName, type: 'interest_formula', row: row.month, actual: row.interest, expected: expectedInterest });
    }

    const expectedGross = row.endEscrow - params.loan - row.cumulativeInterest;
    if (Math.abs(row.profitGrossToDate - expectedGross) > 1e-5) {
      warnings.push(`${simName}: нарушена формула валовой прибыли по строкам.`);
      details.push({ simName, type: 'row_profit_gross', row: row.month, actual: row.profitGrossToDate, expected: expectedGross });
    }

    const expectedNet = expectedGross - row.dpriceCostAccrued;
    if (Math.abs(row.profitNetToDate - expectedNet) > 1e-5) {
      warnings.push(`${simName}: нарушена формула чистой прибыли по строкам.`);
      details.push({ simName, type: 'row_profit_net', row: row.month, actual: row.profitNetToDate, expected: expectedNet });
    }

    prevSales = row.cumulativeSales;
  }

  if (!Number.isFinite(sim.profitGross) || !Number.isFinite(sim.profit) || !Number.isFinite(sim.totalEscrow) || !Number.isFinite(sim.totalInterest) || !Number.isFinite(sim.finalSales)) {
    warnings.push(`${simName}: некорректные финальные агрегаты (NaN/Infinity).`);
  }

  const expectedProfitGross = sim.totalEscrow - params.loan - sim.totalInterest;
  if (Math.abs(sim.profitGross - expectedProfitGross) > 1e-6) {
    warnings.push(`${simName}: нарушена identity profitGross = E_N - loan - I_N.`);
    details.push({ simName, type: 'profit_gross_identity', actual: sim.profitGross, expected: expectedProfitGross });
  }

  const expectedProfitNet = sim.profitGross - sim.dpriceCost;
  if (Math.abs(sim.profit - expectedProfitNet) > 1e-6) {
    warnings.push(`${simName}: нарушена identity profitNet = profitGross - dpriceCost.`);
    details.push({ simName, type: 'profit_net_identity', actual: sim.profit, expected: expectedProfitNet });
  }

  if (!withDPrice && Math.abs(sim.dpriceCost) > 1e-9) {
    warnings.push(`${simName}: для base-сценария dpriceCost должен быть 0.`);
  }

  if (withDPrice && sim.dpriceCost < -1e-9) {
    warnings.push(`${simName}: dpriceCost отрицательный.`);
  }

  return { warnings: Array.from(new Set(warnings)), details };
}

function logInvariantWarnings(warnings, details) {
  if (IS_CLIENT_MODE) return;
  if (!warnings.length) return;
  warnings.forEach(text => console.warn('[DPrice invariant]', text));
  if (details.length) console.warn('[DPrice invariant details]', details);
}

function normalizeClientWarning(text) {
  const source = String(text || '').trim();
  const lower = source.toLowerCase();
  if (!source) return null;

  if (lower.includes('nan') || lower.includes('infinity')) {
    return 'Расчет для текущих параметров временно недоступен. Измените один из параметров и повторите.';
  }
  if (lower.includes('калибровка спроса')) {
    return 'Проверьте входные параметры: часть значений сейчас дает нестабильный расчет.';
  }
  if (lower.includes('не распрода') || lower.includes('sell-out')) {
    return 'В базовом сценарии объект может не закрыть план продаж в выбранный срок.';
  }
  if (lower.includes('отрицательный') && lower.includes('roi')) {
    return 'Для текущих значений ROI может быть отрицательным. Попробуйте скорректировать срок, кредит или темп продаж.';
  }
  if (lower.includes('оптимизатор') || lower.includes('fallback') || lower.includes('сходим')) {
    return 'Для текущих параметров точность оценки ограничена. Рекомендуем скорректировать значения и повторить расчет.';
  }
  if (lower.includes('identity') || lower.includes('строках таблицы') || lower.includes('терминальн') || lower.includes('x_t') || lower.includes('монотон') || lower.includes('формула')) {
    return 'Для выбранных параметров обнаружены внутренние ограничения модели. Измените значения и повторите расчет.';
  }
  if (lower.includes('некорректн') || lower.includes('невозможно продать')) {
    return 'Комбинация параметров выходит за рекомендуемые границы модели. Скорректируйте вводные данные.';
  }

  return source
    .replaceAll('p₀', 'текущей цены')
    .replaceAll('baseline', 'базового сценария')
    .replaceAll('sell-out', 'полного объема продаж');
}

function prepareWarningsForDisplay(warnings) {
  const unique = Array.from(new Set((warnings || []).filter(Boolean)));
  if (!IS_CLIENT_MODE) return unique;

  const mapped = unique
    .map(normalizeClientWarning)
    .filter(Boolean);

  if (!mapped.length && unique.length) {
    return ['Расчет требует уточнения входных параметров. Скорректируйте значения и повторите попытку.'];
  }

  return Array.from(new Set(mapped)).slice(0, 4);
}

function showWarnings(warnings) {
  const warningNode = document.getElementById('model-warning');
  if (!warningNode) return;

  const prepared = prepareWarningsForDisplay(warnings);
  if (!prepared.length) {
    warningNode.style.display = 'none';
    warningNode.innerHTML = '';
    return;
  }

  warningNode.style.display = 'block';
  warningNode.innerHTML = prepared.map(text => `• ${text}`).join('<br>');
}

function renderStepTables(base, opt) {
  const renderRows = sim => sim.rows.map(row => `
    <tr>
      <td>М${row.month}</td>
      <td>${fmtPriceM2(row.price)}</td>
      <td>${rawNumber(row.unitsSold, 2)}</td>
      <td>${rawNumber(row.revenue, 2)}</td>
      <td>${rawNumber(row.startEscrow, 2)}</td>
      <td>${rawNumber(row.uncoveredDebt, 2)}</td>
      <td>${rawNumber(row.interest, 2)}</td>
      <td>${rawNumber(row.endEscrow, 2)}</td>
      <td>${rawNumber(row.cumulativeInterest, 2)}</td>
      <td>${rawNumber(row.profitGrossToDate, 2)}</td>
      <td>${rawNumber(row.profitNetToDate, 2)}</td>
    </tr>
  `).join('');

  const baseBody = document.getElementById('base-step-body');

}

  const monthlyDpriceCost = MODEL_CONSTANTS.DPRICE_ANNUAL_COST_MLN / 12;

  const rows = [

function animVal(id, val) {
  const el = document.getElementById(id);
  if (!el) return;
  if (el.textContent !== val) {
    el.classList.remove('num-update');
    void el.offsetWidth;
    el.classList.add('num-update');
    el.textContent = val;
  }
}

function buildChart(base, opt) {
  const maxMonths = Math.max(base.rows.length, opt.rows.length);
  const labels = Array.from({ length: maxMonths + 1 }, (_, i) => i === 0 ? 'Старт' : `М${i}`);

  const series = (sim, key) => {
    const values = [0];
    for (let i = 0; i < maxMonths; i++) {
      const row = sim.rows[Math.min(i, sim.rows.length - 1)];
      values.push(row ? row[key] : values[values.length - 1]);
    }
    return values;
  };

  const dataWithoutGross = series(base, 'profitGrossToDate');
  const dataWithNet = series(opt, 'profitNetToDate');

  if (chart) chart.destroy();
  const canvas = document.getElementById('myChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'С DPrice (чистая прибыль)',
          data: dataWithNet,
          borderColor: '#4EC94B',
          backgroundColor: 'rgba(78,201,75,0.08)',
          borderWidth: 2.5,
          pointRadius: 0,
          tension: 0.25,
          fill: true
        },
        {

          borderColor: '#EF4444',
          backgroundColor: 'rgba(239,68,68,0.06)',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.25,
          fill: true,
          borderDash: [5, 3]
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'top',
          align: 'end',
          labels: { font: { size: 12, family: 'Arial' }, boxWidth: 20, padding: 12, usePointStyle: true, pointStyleWidth: 16 }
        },
        tooltip: {
          mode: 'index',
          intersect: false,
          callbacks: {
            label: ctx => `${ctx.dataset.label}: ${rawNumber(ctx.parsed.y, 2)} млн ₽`,
            afterLabel: ctx => {
              const dataIndex = ctx.dataIndex;

  });

function evaluateScenario(values, label) {
  const params = buildCoreParams(values);
  const demand = buildDemandParams(params);
  const basePolicy = buildBasePolicy(params, demand);
  const base = simulatePolicy(basePolicy.prices, params, demand, { withDPrice: false });
  const optResult = optimizeControlPolicy(params, demand, { baseUnits: basePolicy.units });
  const opt = optResult.sim;

  const feasible = params.lots >= params.plannedMonths * demand.qMin - MODEL_CONSTANTS.MODEL_TOL
    && params.lots <= params.plannedMonths * demand.qMax + MODEL_CONSTANTS.MODEL_TOL;

  const grossGain = opt.profitGross - base.profitGross;
  const netGain = opt.profit - base.profit;
  const roi = opt.dpriceCost > MODEL_CONSTANTS.EPS ? netGain / opt.dpriceCost : NaN;

  return {
    scenario: label,
    feasibleSellout: feasible,
    baseFinalSales: base.finalSales,
    optFinalSales: opt.finalSales,
    baseGross: base.profitGross,
    optGross: opt.profitGross,
    grossGain,
    netGain,
    roi,
    grossDominance: opt.profitGross + MODEL_CONSTANTS.GROSS_TOL >= base.profitGross,
    hasNaN: hasNaNOrInfinity([base.profitGross, opt.profitGross, base.finalSales, opt.finalSales, base.totalEscrow, opt.totalEscrow])
  };
}

function recalc() {
  try {
    applyAdaptiveSliderBounds();

    const params = buildCoreParams(state);
    const demandParams = buildDemandParams(params);
    const warnings = [];

    if (!(demandParams.lambda > MODEL_CONSTANTS.EPS)) {
      warnings.push('Калибровка спроса дала некорректную емкость Lambda; проверьте входные параметры.');
    }

    const feasibleSellout = params.lots >= params.plannedMonths * demandParams.qMin - MODEL_CONSTANTS.MODEL_TOL
      && params.lots <= params.plannedMonths * demandParams.qMax + MODEL_CONSTANTS.MODEL_TOL;

    const basePolicy = buildBasePolicy(params, demandParams);
    warnings.push(...basePolicy.warnings);

    const base = simulatePolicy(basePolicy.prices, params, demandParams, { withDPrice: false });
    warnings.push(...base.warnings);

    let optCandidate = optimizeControlPolicy(params, demandParams, { baseUnits: basePolicy.units });
    let opt = optCandidate.sim;
    warnings.push(...optCandidate.warnings);
    warnings.push(...opt.warnings);

    if (base.finalSales < params.lots - 0.5) {
      warnings.push('Базовый сценарий p₀ не выполняет sell-out за плановый горизонт.');
    }

    const grossGainBeforeGuard = opt.profitGross - base.profitGross;
    if (feasibleSellout && grossGainBeforeGuard < -MODEL_CONSTANTS.GROSS_TOL) {
      warnings.push('Оптимизатор дал результат хуже базовой допустимой стратегии. Применён fallback: базовая стратегия как нижняя граница.');
      const fallbackSim = simulateUnitsPolicy(basePolicy.units, params, demandParams, { withDPrice: true });
      optCandidate = {
        ...optCandidate,
        source: 'forced_base_guard',
        sim: fallbackSim,
        units: basePolicy.units.slice(),
        prices: basePolicy.prices.slice(),
        convergenceInfo: {
          ...optCandidate.convergenceInfo,
          source: 'forced_base_guard'
        }
      };
      opt = optCandidate.sim;
    }

    const baseInvariant = collectInvariantViolations('base', base, params, false);
    const optInvariant = collectInvariantViolations('opt', opt, params, true);
    warnings.push(...baseInvariant.warnings);
    warnings.push(...optInvariant.warnings);
    logInvariantWarnings(baseInvariant.warnings, baseInvariant.details);
    logInvariantWarnings(optInvariant.warnings, optInvariant.details);

    const grossGain = opt.profitGross - base.profitGross;
    const netGain = opt.profit - base.profit;
    const revenueDelta = opt.totalRevenue - base.totalRevenue;
    const interestSavings = base.totalInterest - opt.totalInterest;

    if (feasibleSellout && grossGain < -MODEL_CONSTANTS.GROSS_TOL) {
      warnings.push('Валовый эффект оптимизации отрицательный: это ошибка оптимизатора или ограничений.');
    }

    if (grossGain >= -MODEL_CONSTANTS.GROSS_TOL && netGain < -MODEL_CONSTANTS.GROSS_TOL) {
      warnings.push('Валовый эффект оптимизации положительный, но после стоимости DPrice чистый ROI отрицательный.');
    }

    /*
      Если opt.profitGross >= base.profitGross, но opt.profit < base.profit,
      это не ошибка математики: оптимизация улучшила валовую траекторию,
      но коммерческая стоимость DPrice оказалась выше валового выигрыша.
      Если же opt.profitGross < base.profitGross, это ошибка оптимизатора,
      поэтому применяется fallback base-as-candidate.
    */
    const roi = opt.dpriceCost > MODEL_CONSTANTS.EPS ? netGain / opt.dpriceCost : NaN;
    const monthlyProfitGain = netGain / Math.max(params.plannedMonths, 1);
    const paybackMonths = monthlyProfitGain > MODEL_CONSTANTS.EPS
      ? opt.dpriceCost / monthlyProfitGain
      : Infinity;

    let debtSavingsText = '—';
    if (base.debtFreeMonth !== null && opt.debtFreeMonth !== null) {
      const savedDebtMonths = base.debtFreeMonth - opt.debtFreeMonth;
      debtSavingsText = `${savedDebtMonths >= 0 ? '+' : '−'}${Math.abs(savedDebtMonths).toFixed(1)} мес.`;
    }

    animVal('m-roi', fmtX(roi));
    animVal('m-payback', Number.isFinite(paybackMonths) ? (paybackMonths < 1 ? '< 1 мес.' : fmtMonthInt(paybackMonths)) : 'не окупается');
    animVal('m-pf', fmtMln(interestSavings));
    animVal('m-extra', debtSavingsText);
    animVal('m-rev', fmtMln(revenueDelta));
    animVal('m-total', fmtMln(netGain));
    animVal('m-pf-loss', fmtMln(base.totalInterest));
    animVal('m-period-before', fmtMonth(base.salesDuration));
    animVal('m-period-after', fmtMonth(opt.salesDuration));

    const beforePeriod = Math.max(base.salesDuration, 1);
    const afterPeriod = Math.max(opt.salesDuration, 0);
    const barPct = Math.min(100, (afterPeriod / beforePeriod) * 100);
    const barNode = document.getElementById('pb-bar');
    if (barNode) barNode.style.width = `${barPct}%`;

    renderComparisonTable(base, opt, optCandidate, params, null);
    if (!IS_CLIENT_MODE) {
      renderStaticParamTable(params, demandParams);
      renderStepTables(base, opt);
    }
    renderDeferredVisuals(base, opt);
    logModelAudit(params, demandParams, base, opt, optCandidate, feasibleSellout, grossGain, netGain, roi);
  } catch (err) {
    if (!IS_CLIENT_MODE) console.error('recalc failed', err);
  }
}
