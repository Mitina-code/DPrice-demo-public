  <title>DPrice — two sales strategies, one set of apartments</title>
  <!--
    РАСЧЁТ НА РЕАЛЬНЫХ КВАРТИРАХ — по регионам (ОАЭ, Таиланд, Россия), 4 языка.
    Это исходник. Готовая страница site/scenario.html собирается командой:
      node scenario/build.js
    Данные регионов — scenario/data/data-*.json (формат — data-contract.md).
    Открыть нужный регион и язык: scenario.html?region=uae&lang=ar
  -->

    --bg:#f5f7f4; --card:#ffffff; --ink:#15181e; --text-2:#3f4652; --muted:#6b7380;
    --line:#e3e7e1; --line-2:#d3d9d1;
    --green:#3fdd84; --green-light:#61e79b; --green-ink:#13854a; --gold:#f4b740; --gold-ink:#a8700a;
    --dark:#14161c; --dark-2:#1a1d24; --dark-text:#eaeff5; --dark-muted:hsla(0,0%,100%,.62);
    --radius:18px; --shadow:0 18px 50px rgba(21,24,30,.07);
  }
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
    background-color:var(--bg);background-image:var(--plan);background-size:1000px 800px;background-position:center top}
  @media(max-width:768px){body{background-size:750px 600px}}
  html[lang="ar"] *{font-family:"Noto Sans Arabic",Inter,sans-serif!important;letter-spacing:0!important}
  html[lang="th"] *{font-family:"Noto Sans Thai",Inter,sans-serif!important;letter-spacing:0!important}
  button,input{font:inherit}button{cursor:pointer}a{color:var(--green-ink)}
  :is(a,button,input,summary):focus-visible{outline:2px solid var(--green);outline-offset:3px}
  .ltr{direction:ltr;unicode-bidi:isolate}
  .shell{max-width:1280px;margin:auto;padding:0 32px 70px}

  /* ---- шапка ---- */
  .top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap;
    background:rgba(245,247,244,.86);backdrop-filter:saturate(140%) blur(12px);-webkit-backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid var(--line)}
  .brand{display:inline-flex;align-items:center;text-decoration:none}.brand svg{width:82px;height:28px;display:block}
  .switches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .seg{display:inline-flex;gap:2px;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:#fff}
  .seg button{border:0;background:none;color:var(--muted);padding:7px 12px;border-radius:999px;font-weight:600;font-size:12px;letter-spacing:.03em}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:rgba(63,221,132,.16);color:var(--green-ink)}

  /* ---- типографика ---- */
  h1,h2,h3,p{margin-top:0}
  h1{font-size:clamp(34px,4.6vw,56px);font-weight:700;line-height:1.06;letter-spacing:-.03em;margin:0 0 20px;text-wrap:balance}
  h2{font-size:clamp(26px,3.2vw,38px);font-weight:700;line-height:1.12;letter-spacing:-.025em;margin-bottom:12px;text-wrap:balance}
  h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .eyebrow{display:inline-flex;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green-ink);margin-bottom:16px}

  /* ---- первый экран ---- */
  .hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:48px;padding:56px 0 48px;align-items:center}
  .hero .eyebrow{padding:7px 16px;border-radius:999px;background:rgba(63,221,132,.12);border:1px solid rgba(19,133,74,.25)}
  .hero p{font-size:17px;color:var(--text-2);max-width:720px;line-height:1.6}
  .hero-side{position:relative;overflow:hidden;background:var(--dark);color:var(--dark-text);border-radius:24px;padding:30px 30px;display:flex;flex-direction:column;gap:16px;min-height:280px;box-shadow:0 24px 70px rgba(11,12,16,.25)}
  .hero-side::before{content:"";position:absolute;top:-40%;left:50%;width:320px;height:320px;transform:translateX(-50%);background:radial-gradient(circle,rgba(63,221,132,.22) 0,transparent 70%);pointer-events:none}
  .hero-side>*{position:relative}
  .hero-side .label{color:var(--green-light);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  .hero-side strong{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
  .hero-side small{color:var(--dark-muted);line-height:1.55;font-size:13px}
  .facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
  .pill{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600;color:var(--text-2)}

  /* ---- рабочая область ---- */
  .workspace{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
  .toolbar{display:flex;justify-content:space-between;align-items:end;gap:24px;padding:28px 30px 24px;border-bottom:1px solid var(--line)}
  .toolbar p{color:var(--muted);margin:0}
  .objectives{display:flex;gap:4px;border:1px solid var(--line-2);border-radius:999px;padding:4px;flex-wrap:wrap;background:var(--bg)}
  .objective{border:0;background:transparent;color:var(--text-2);padding:11px 18px;border-radius:999px;font-weight:600;white-space:nowrap;transition:background .18s,color .18s}
  .objective.active{background:var(--green);color:var(--dark);box-shadow:0 8px 22px rgba(63,221,132,.3)}
  .objective:hover:not(.active){background:#fff}
  .score-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr}
  .score{padding:26px 30px 28px;border-inline-end:1px solid var(--line)}.score:last-child{border-inline-end:0}
  .score .cap{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.11em;font-weight:700}
  .big-number{font-size:clamp(30px,3.2vw,48px);font-weight:700;line-height:1.08;letter-spacing:-.035em;white-space:nowrap;margin:12px 0 4px}
  .score.focus{background:linear-gradient(160deg,rgba(63,221,132,.14),rgba(63,221,132,.03) 70%)}
  .score.focus .big-number{color:var(--green-ink)}
  .score small{color:var(--muted)}
  .warnline{border-top:1px solid var(--line);background:rgba(244,183,64,.09);padding:14px 30px;font-size:13px;color:var(--text-2)}
  .warnline strong{color:var(--gold-ink)}

  /* ---- разделы и разделители ---- */
  .section{position:relative;padding-top:72px;margin-top:8px}
  .section::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(19,133,74,.25) 25%,rgba(63,221,132,.7) 50%,rgba(19,133,74,.25) 75%,transparent)}
  .section::after{content:"";position:absolute;top:-50px;left:50%;transform:translateX(-50%);width:min(800px,90%);height:100px;pointer-events:none;z-index:-1;
    background:radial-gradient(ellipse at center,rgba(63,221,132,.12),transparent 70%)}
  .section-head{display:flex;align-items:start;gap:16px;max-width:960px;margin-bottom:24px}
  .section-number{flex:0 0 44px;height:44px;border-radius:12px;background:rgba(63,221,132,.14);color:var(--green-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .section-head p{max-width:760px;color:var(--muted);margin:0}
  .split{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;min-width:0;box-shadow:var(--shadow)}
  .panel-heading{display:flex;justify-content:space-between;gap:15px;align-items:baseline;flex-wrap:wrap}.panel-heading small{color:var(--muted)}
  .legend{display:flex;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:12px;font-weight:600;margin:16px 0 0}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-inline-end:6px}

  /* ---- график ---- */
  .chart{width:100%;height:320px;display:block;overflow:visible;direction:ltr}
  .chart text{font-family:Inter,sans-serif;fill:var(--muted);font-size:11px}
  .chart .gridline{stroke:var(--line);stroke-width:1}
  .chart .base-line{stroke:var(--gold);stroke-width:3;fill:none}.chart .opt-line{stroke:#22b866;stroke-width:4;fill:none}
  .chart .dot-base{fill:var(--gold)}.chart .dot-opt{fill:#22b866}
  .chart .fill-opt{fill:rgba(63,221,132,.16);stroke:none}.chart .fill-base{fill:rgba(244,183,64,.12);stroke:none}
  .monthly{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:18px}
  .month{background:#fff;padding:12px 8px;text-align:center;min-width:0}
  .month b{display:block;font-size:12px}.month span{font-size:11px;color:var(--muted)}
  .month strong{display:block;margin-top:5px;color:var(--green-ink);font-size:13px}.month em{display:block;color:var(--gold-ink);font-style:normal;font-size:11px}
  .small-kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
  .small-kpi{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}
  .small-kpi span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .small-kpi strong{display:block;font-size:20px;margin-top:6px;letter-spacing:-.02em}
  .takeaway{border-top:1px solid var(--line);margin-top:22px;padding-top:20px;color:var(--text-2)}.takeaway strong{color:var(--ink)}

  /* ---- допущения ---- */
  .scenario{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .control{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .control label{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin-bottom:8px}
  .control output{color:var(--green-ink)}
  .control input[type=range]{width:100%;accent-color:#22b866}
  .control p{color:var(--muted);font-size:12px;margin:10px 0 0;min-height:36px}
  .ev{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:12px}
  .ev.assumed{background:rgba(244,183,64,.16);color:var(--gold-ink)}
  .ev.observed{background:rgba(63,221,132,.16);color:var(--green-ink)}
  .ev.derived{background:rgba(91,165,255,.14);color:#2b62b8}
  .note{border-inline-start:3px solid var(--gold);border-radius:0 12px 12px 0;padding:13px 18px;margin:18px 0 0;background:rgba(244,183,64,.08);color:var(--text-2);font-size:13px}
  html[dir="rtl"] .note{border-radius:12px 0 0 12px}

  /* ---- квартиры ---- */
  .building-wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
  .building{background:var(--dark);color:var(--dark-text);border-radius:24px;padding:24px 24px 18px;min-width:0;box-shadow:0 24px 70px rgba(11,12,16,.2)}
  .building h3{margin-bottom:2px}.building .sub{font-size:12px;color:var(--dark-muted);margin-bottom:18px}
  .floor-row{display:grid;grid-template-columns:76px 1fr;align-items:center;min-height:36px;border-top:1px solid hsla(0,0%,100%,.08)}
  .floor-label{font-size:11px;color:var(--dark-muted)}
  .floor-units{display:flex;gap:5px;align-items:center;min-height:35px;flex-wrap:wrap;padding:4px 0}
  .flat{border:1px solid hsla(0,0%,100%,.16);background:hsla(0,0%,100%,.06);color:var(--dark-text);padding:6px 8px;min-width:60px;text-align:center;font-size:10px;line-height:1.25;border-radius:8px;transition:transform .16s,border-color .16s}
  .flat:hover,.flat:focus-visible{transform:translateY(-2px);border-color:var(--green)}
  .flat.up{background:rgba(63,221,132,.22);border-color:rgba(63,221,132,.45)}
  .flat.down{background:rgba(244,183,64,.2);border-color:rgba(244,183,64,.45)}
  .flat.neutral{background:hsla(0,0%,100%,.06)}
  .flat.sel{outline:2px solid var(--green-light);outline-offset:1px}
  .flat b{display:block;font-size:11px}
  .building-foot{font-size:11px;color:var(--dark-muted);margin:16px 0 0}
  .unit-detail{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .unit-detail .id{font-size:11px;color:var(--green-ink);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  .unit-detail h3{font-size:30px;font-weight:700;line-height:1.12;letter-spacing:-.03em;margin:12px 0 22px}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .detail-grid span{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.05em}
  .detail-grid strong{display:block;margin-top:5px;font-size:17px}
  .unit-detail .detail-note{margin-top:auto;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:13px}

  /* ---- метод ---- */
  .method-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .method{padding:24px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .method .n{width:44px;height:44px;border-radius:12px;background:rgba(63,221,132,.14);color:var(--green-ink);display:flex;align-items:center;justify-content:center;font-weight:700}
  .method h3{margin:14px 0 8px}.method p{font-size:13px;color:var(--muted);margin:0}
  .formula{background:var(--dark);color:var(--dark-text);border-radius:18px;padding:24px 28px;margin-top:16px;font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.8;overflow:auto;direction:ltr;text-align:left}
  .formula strong{color:var(--green-light)}
  .disclosure{font-size:13px;color:var(--muted);line-height:1.7;margin-top:16px}

  /* ---- источники ---- */
  details{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-top:14px;overflow:hidden}
  summary{cursor:pointer;padding:18px 22px;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;text-align:start}
  th{background:var(--bg);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
  td.num{white-space:nowrap}
  .table-scroll{overflow:auto}
  .notes{padding-inline-start:18px;color:var(--muted);font-size:13px}.notes li{margin:7px 0}
  .footer{border-top:1px solid var(--line);margin-top:64px;padding-top:22px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:12px}

  @media(max-width:1000px){.shell{padding:0 20px 60px}.hero{grid-template-columns:1fr;gap:24px}.toolbar{align-items:start;flex-direction:column}.split,.building-wrap{grid-template-columns:1fr}.scenario{grid-template-columns:1fr 1fr}.chart{height:280px}}
  @media(max-width:680px){.shell{padding:0 16px 56px}.hero{padding:36px 0}.hero p{font-size:16px}.toolbar{padding:22px}.objectives,.objective{width:100%}.score-grid,.scenario,.method-grid{grid-template-columns:1fr}.score{border-inline-end:0;border-bottom:1px solid var(--line)}.score:last-child{border-bottom:0}.section{padding-top:52px}.panel{padding:18px}.monthly{grid-template-columns:repeat(3,1fr)}.building{padding:16px}.flat{min-width:52px;padding:5px 4px}.footer{display:block}.big-number{white-space:normal}}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.flat,.objective{transition:none}}

  </style>
</head>

    <section class="section" aria-labelledby="src-title">

const LANGS = ['en', 'ru', 'ar', 'th'];
const LOCALE = { en: 'en-GB', ru: 'ru-RU', ar: 'ar-AE-u-nu-latn', th: 'th-TH' };
const HORIZON = 6, GRID = Array.from({ length: 31 }, (_, i) => .85 + i * .01);

const q = new URLSearchParams(location.search);

const t = (k, vars = {}) => {

};
const nf = (opts) => new Intl.NumberFormat(LOCALE[lang], opts);
const cur = () => D.scenario.currency;

const num1 = (x) => nf({ minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(x);
const pct = (x, d = 1) => nf({ style: 'percent', minimumFractionDigits: d, maximumFractionDigits: d }).format(x);
const areaUnit = () => D.scenario.display_area_unit === 'sq ft' ? t('sqft') : t('m2');
const areaShow = (f) => D.scenario.display_area_unit === 'sq ft' ? (f.area_raw_unit === 'sq ft' ? f.area_raw : f.area_m2 / SQFT) : f.area_m2;
const ppa = (f) => f.price_total / areaShow(f);
const input = (key) => D.inputs.find(i => i.key === key);
const roomName = (f) => f.rooms === 0 ? t('room0') : t('roomN', { n: f.rooms });

/* ===== Модель ===== */
/*MODEL-START*/
function baseProbability(f) {
  const b = input('base_conversion').value;
  if (typeof b === 'object') {
    const v = b[String(f.rooms)] ?? b.default ?? .2;
    return Math.min(.35, v + (f.floor ? Math.max(0, f.floor - 8) * .0025 : 0));
  }
  const mult = { 0: 1.05, 1: 1, 2: .9, 3: .65, 4: .55 }[Math.min(4, f.rooms)] ?? .5;
  return Math.min(.35, b * mult);
}
const probability = (f, ratio, p) => Math.min(.93, baseProbability(f) * Math.exp(-p.elasticity * (ratio - 1)));
const metric = (f, ratio, p, kind) => kind === 'revenue' ? f.price_total * ratio : f.price_total * (ratio * (1 - p.commission) - p.cost);

function chooseUnitPolicy(f, p, kind) {
  const ratios = Array(HORIZON), future = Array(HORIZON + 1).fill(0);
  for (let m = HORIZON - 1; m >= 0; m--) {
    let best = -Infinity, choice = 1;
    for (const ratio of GRID) {
      const qq = probability(f, ratio, p), carry = kind === 'contribution' ? f.price_total * p.carry : 0;
      const v = qq * metric(f, ratio, p, kind) + (1 - qq) * (future[m + 1] - carry);
      if (v > best + 1e-7) { best = v; choice = ratio; }
    }

  }
  return ratios;
}
function evaluate(policies, p) {
  const monthly = Array.from({ length: HORIZON }, () => ({ revenue: 0, contribution: 0, sold: 0, remaining: 0 }));
  for (const f of flats) {
    let survival = 1;
    for (let m = 0; m < HORIZON; m++) {
      const ratio = policies[f.id][m], qq = probability(f, ratio, p), sale = survival * qq;
      survival *= 1 - qq;
      monthly[m].revenue += sale * f.price_total * ratio;
      monthly[m].contribution += sale * (f.price_total * ratio * (1 - p.commission) - f.price_total * p.cost) - survival * f.price_total * p.carry;
      monthly[m].sold += sale; monthly[m].remaining += survival;
    }
  }
  const sum = k => monthly.reduce((s, r) => s + r[k], 0);
  return { monthly, revenue: sum('revenue'), contribution: sum('contribution'), sold: sum('sold'), remaining: monthly[HORIZON - 1].remaining };
}
function uniformPolicy(p) {

    let choice = GRID[0], error = Infinity;

      if (diff < error - 1e-10 || (Math.abs(diff - error) <= 1e-10 && ratio > choice)) { error = diff; choice = ratio; }
    }
    monthlyRatios.push(choice);
    for (const f of flats) { policies[f.id].push(choice); survival[f.id] *= 1 - probability(f, choice, p); }
  }
  return { policies, monthlyRatios };
}

/*MODEL-END*/
/* ===== Отрисовка ===== */
const $ = s => document.querySelector(s);
function cumulative(rows, key) { let s = 0; return [0, ...rows.map(r => (s += r[key]))]; }
function drawChart(base, opt, key) {
  const a = cumulative(base.monthly, key), b = cumulative(opt.monthly, key), all = [...a, ...b];
  const min = Math.min(0, ...all), max = Math.max(...all), span = Math.max(1, max - min), L = 64, R = 690, TOP = 22, B = 277;
  const x = i => L + (R - L) * i / HORIZON, y = v => B - (v - min) / span * (B - TOP);
  const path = arr => arr.map((v, i) => `${i ? 'L' : 'M'} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const fill = arr => `${path(arr)} L ${x(HORIZON)} ${B} L ${L} ${B} Z`;
  let s = '';
  for (let i = 0; i <= 4; i++) { const v = min + span * i / 4, yy = y(v); s += `<line class="gridline" x1="${L}" x2="${R}" y1="${yy}" y2="${yy}"/><text x="${L - 10}" y="${yy + 4}" text-anchor="end">${nf({ notation: 'compact', maximumFractionDigits: 1 }).format(v)}</text>`; }
  for (let i = 0; i <= HORIZON; i++) s += `<text x="${x(i)}" y="${B + 23}" text-anchor="middle">${i ? t('month_short', { i }) : t('start')}</text>`;
  s += `<path class="fill-base" d="${fill(a)}"/><path class="fill-opt" d="${fill(b)}"/><path class="base-line" d="${path(a)}"/><path class="opt-line" d="${path(b)}"/>`;
  for (let i = 1; i <= HORIZON; i++) s += `<circle class="dot-base" cx="${x(i)}" cy="${y(a[i])}" r="3.5"/><circle class="dot-opt" cx="${x(i)}" cy="${y(b[i])}" r="4"/>`;
  $('#chart').innerHTML = s;
  $('#chart').setAttribute('aria-label', `${t(key === 'revenue' ? 'chart_rev' : 'chart_con')}: ${t('legend_base')} ${money(base[key])}, ${t('legend_opt')} ${money(opt[key])}`);
}
function flatButton(f, policies) {
  const ratio = policies[f.id][0], b = document.createElement('button');
  b.type = 'button';
  b.className = `flat ${ratio > 1.005 ? 'up' : ratio < .995 ? 'down' : 'neutral'}${f.id === selectedId ? ' sel' : ''}`;
  b.innerHTML = `<b class="ltr">${nf({ maximumFractionDigits: 0 }).format(areaShow(f))} ${areaUnit()}</b>${roomName(f)}`;
  b.title = `${t('unit_lbl', { id: f.id })} · ${moneyFull(f.price_total * ratio)}`;
  b.setAttribute('aria-label', b.title);
  b.addEventListener('click', () => { selectedId = f.id; renderUnits(policies); });
  return b;
}
function renderUnits(policies) {
  const root = $('#floors'); root.innerHTML = '';
  const hasFloors = flats.every(f => Number.isFinite(f.floor));
  const groups = hasFloors
    ? [...new Set(flats.map(f => f.floor))].sort((a, b) => b - a).map(fl => [t('floor', { f: fl }), flats.filter(f => f.floor === fl)])
    : [...new Set(flats.map(f => f.rooms))].sort((a, b) => a - b).map(r => [r === 0 ? t('room0') : t('roomN', { n: r }), flats.filter(f => f.rooms === r)]);
  for (const [label, list] of groups) {
    const row = document.createElement('div'); row.className = 'floor-row';
    const l = document.createElement('span'); l.className = 'floor-label'; l.textContent = label; row.append(l);
    const u = document.createElement('div'); u.className = 'floor-units';
    list.forEach(f => u.append(flatButton(f, policies))); row.append(u); root.append(row);
  }
  $('#s3-p').textContent = t(hasFloors ? 's3_p_floor' : 's3_p_type');
  $('#bldg-foot').textContent = t(hasFloors ? 'foot_floor' : 'foot_type');
  const f = flats.find(x => x.id === selectedId) || flats[0], ratio = policies[f.id][0];
  $('#unit-detail').innerHTML = `<span class="id">${t('unit_lbl', { id: f.id })}</span>
    <h3>${roomName(f)}<br><span class="ltr">${nf({ maximumFractionDigits: 1 }).format(areaShow(f))} ${areaUnit()}</span></h3>
    <div class="detail-grid">
      <div><span>${t('d_floor')}</span><strong class="ltr">${Number.isFinite(f.floor) ? f.floor + (D.scenario.floors_total ? ' / ' + D.scenario.floors_total : '') : '—'}</strong></div>
      <div><span>${t('d_pub')}</span><strong class="ltr">${moneyFull(f.price_total)}</strong></div>
      <div><span>${t('d_opt')}</span><strong class="ltr">${moneyFull(f.price_total * ratio)}</strong></div>
      <div><span>${t('d_diff')}</span><strong class="ltr">${(ratio - 1) > 0 ? '+' : ''}${Math.round((ratio - 1) * 100)}%</strong></div>
      <div><span>${t('d_ppa', { unit: areaUnit() })}</span><strong class="ltr">${moneyFull(ppa(f))}</strong></div>
      <div><span>${t('d_base')}</span><strong class="ltr">${pct(baseProbability(f))}</strong></div>
    </div>
    <p class="detail-note">${t('d_note')}${f.source_url ? ` <a href="${f.source_url}" target="_blank" rel="noopener noreferrer">${t('d_src')}</a>` : ''}</p>`;
}
const EV = c => `<span class="ev ${c}">${t('ev_' + c)}</span>`;
function renderControls() {
  const defs = [
    ['elasticity', 'a_elast', 'a_elast_p', v => num1(v), 0.1],
    ['cost', 'a_cost', 'a_cost_p', v => pct(v, 0), 0.01],
    ['carry', 'a_carry', 'a_carry_p', v => pct(v, 1), 0.001],
    ['commission', 'a_comm', 'a_comm_p', v => pct(v, 1), 0.005],
  ];
  $('#controls').innerHTML = defs.map(([k, lab, help, fmt, step]) => {
    const i = input(k), [lo, hi] = i.range || [0, 1];
    return `<div class="control">${EV(i.evidence_class)}<label for="c-${k}">${t(lab)} <output id="o-${k}">${fmt(params[k])}</output></label>
      <input id="c-${k}" type="range" min="${lo}" max="${hi}" step="${step}" value="${params[k]}"><p>${t(help)}${i.payer ? ' · ' + t('payer') + ': ' + t('payer_' + i.payer) : ''}</p></div>`;
  }).join('');
  for (const [k, , , fmt] of defs) $('#c-' + k).addEventListener('input', e => { params[k] = +e.target.value; $('#o-' + k).textContent = fmt(params[k]); render(); });
}
function renderLedger() {
  // share/probability — доли (0.05 → 5%); единица «% …» — уже проценты (4 → 4%)
  const one = (v, unit) => typeof v !== 'number' ? String(v)
    : /share|probability/.test(unit || '') ? pct(v, 1)
    : /^%|%/.test(unit || '') ? nf({ maximumFractionDigits: 2 }).format(v) + '%'
    : nf({ maximumFractionDigits: 2 }).format(v);
  const val = i => {
    if (typeof i.value === 'object' && i.value !== null) return Object.entries(i.value).map(([k, v]) => `${k}: ${typeof v === 'number' ? pct(v, 0) : v}`).join(', ');
    return i.value === null || i.value === undefined ? '—' : one(i.value, i.unit);
  };
  $('#inputs-table').innerHTML = D.inputs.map(i => `<tr><td>${t('in_' + i.key) !== 'in_' + i.key ? t('in_' + i.key) : i.label}${i.note ? `<br><small style="color:var(--muted)">${i.note}</small>` : ''}</td><td class="num">${val(i)}${i.unit && !/share|probability/.test(i.unit) && typeof i.value !== 'number' ? '' : ''}${i.range ? `<br><small style="color:var(--muted)">${i.range.map(r => one(r, i.unit)).join(' – ')}</small>` : ''}</td><td>${EV(i.evidence_class)}${i.payer ? `<br><small>${t('payer')}: ${t('payer_' + i.payer)}</small>` : ''}</td><td>${i.source ? `<a href="${i.source}" target="_blank" rel="noopener noreferrer">${t('link')}</a>` : '—'}${i.effective_date ? `<br><small>${i.effective_date}</small>` : ''}</td></tr>`).join('');
  $('#units-summary').textContent = t('units_summary', { n: flats.length });
  $('#th-area').textContent = t('t_area', { unit: areaUnit() });
  $('#th-price').textContent = t('t_price', { cur: cur() });
  $('#th-ppa').textContent = t('t_ppa', { unit: areaUnit() });
  $('#units-table').innerHTML = flats.map(f => `<tr><td>${f.unit_number || f.source_id || f.id}</td><td>${roomName(f)}</td><td class="num">${Number.isFinite(f.floor) ? f.floor : '—'}</td><td class="num ltr">${nf({ maximumFractionDigits: 1 }).format(areaShow(f))}</td><td class="num ltr">${moneyFull(f.price_total)}</td><td class="num ltr">${moneyFull(ppa(f))}</td><td>${f.source_url ? `<a href="${f.source_url}" target="_blank" rel="noopener noreferrer">${t('link')}</a>` : '—'}</td></tr>`).join('');
  $('#ledger-notes').innerHTML = (D.ledger_notes || []).map(n => `<li>${n}</li>`).join('');
}
function render() {
  const p = params, uni = uniformPolicy(p);
  const policies = Object.fromEntries(flats.map(f => [f.id, chooseUnitPolicy(f, p, objective)]));
  const base = evaluate(uni.policies, p), opt = evaluate(policies, p), key = objective;
  const diff = opt[key] - base[key], rel = base[key] !== 0 ? diff / Math.abs(base[key]) : 0;
  $('#primary-label').textContent = t(key === 'revenue' ? 'cap_uplift_rev' : 'cap_uplift_con');
  $('#uplift').textContent = signed(diff);
  $('#uplift-percent').textContent = t('vs_base', { pct: (diff >= 0 ? '+' : '−') + pct(Math.abs(rel)) });
  $('#base-metric').textContent = money(base[key]);
  $('#opt-metric').textContent = money(opt[key]);
  $('#base-sub').textContent = t('deals', { x: num1(base.sold), n: flats.length });
  $('#opt-sub').textContent = t('deals', { x: num1(opt.sold), n: flats.length });
  $('#base-sold').textContent = `${num1(base.sold)} / ${flats.length}`;
  $('#opt-sold').textContent = `${num1(opt.sold)} / ${flats.length}`;
  $('#rev-delta').textContent = signed(opt.revenue - base.revenue);
  $('#con-delta').textContent = signed(opt.contribution - base.contribution);
  $('#chart-title').textContent = t(key === 'revenue' ? 'chart_rev' : 'chart_con');
  $('#chart-unit').textContent = t('chart_unit', { cur: cur() });
  $('#takeaway-head').textContent = t(key === 'revenue' ? 'why_head_rev' : 'why_head_con');
  $('#takeaway').innerHTML = t(key === 'revenue' ? 'take_rev' : 'take_con', { rev: signed(opt.revenue - base.revenue), con: signed(opt.contribution - base.contribution), left: num1(opt.remaining), leftb: num1(base.remaining) });
  $('#months').innerHTML = Array.from({ length: HORIZON }, (_, i) => `<div class="month"><b>${t('month', { i: i + 1 })}</b><span>${t('common_change', { x: (uni.monthlyRatios[i] > 1 ? '+' : '') + Math.round((uni.monthlyRatios[i] - 1) * 100) })}</span><strong class="ltr">${money(opt.monthly[i][key])}</strong><em>${t('uniform_lbl', { x: money(base.monthly[i][key]) })}</em></div>`).join('');
  drawChart(base, opt, key);
  renderUnits(policies);
  document.querySelectorAll('.objective').forEach(b => { const on = b.dataset.objective === objective; b.classList.toggle('active', on); b.setAttribute('aria-pressed', on); });
}
function renderStatic() {
  const html = document.documentElement;
  html.lang = lang; html.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t('doc_title');
  document.querySelectorAll('[data-t]').forEach(e => e.innerHTML = t(e.dataset.t));
  document.querySelectorAll('[data-t-title]').forEach(e => e.title = t(e.dataset.tTitle));
  $('#regions').innerHTML = REGION_ORDER.map(r => `<button type="button" data-r="${r}" aria-pressed="${r === region}">${t('r_' + r)}</button>`).join('');
  $('#langs').innerHTML = LANGS.map(l => `<button type="button" data-l="${l}" aria-pressed="${l === lang}" lang="${l}">${{ en: 'EN', ru: 'RU', ar: 'عربي', th: 'ไทย' }[l]}</button>`).join('');
  document.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { region = b.dataset.r; lang = lang === 'ar' && region === 'uae' ? 'ar' : REGION_LANG[region]; boot(); }));
  document.querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', () => { lang = b.dataset.l; boot(); }));
  const S = D.scenario, areas = flats.map(areaShow);
  $('#lead').textContent = t('lead', { h: HORIZON });
  $('#facts').innerHTML = [t('pill_units', { n: flats.length }), `${S.project} · ${S.building}`, t('pill_area', { min: nf({ maximumFractionDigits: 0 }).format(Math.min(...areas)), max: nf({ maximumFractionDigits: 0 }).format(Math.max(...areas)), unit: areaUnit() }), t('pill_cur', { cur: S.currency })].map(x => `<span class="pill">${x}</span>`).join('');
  $('#side-title').innerHTML = `${S.project}<br>${S.building}<br><small style="font-family:inherit;font-size:13px;color:#9ebcb8">${t('city_' + region)} · ${S.developer}</small>`;
  $('#side-note').textContent = t('side_note', { date: S.as_of_date, eff: /^unknown/i.test(S.price_effective_date || 'unknown') ? t('eff_unknown') : S.price_effective_date });
  $('#ws-eyebrow').textContent = t('ws_eyebrow', { h: HORIZON });
  $('#why-p').textContent = t('why_p', { h: HORIZON });
  $('#bldg-title').textContent = `${S.project} · ${S.building}`;
  $('#bldg-sub').textContent = t('bldg_sub', { n: flats.length });
  $('#m1-p').textContent = t('m1_p', { n: flats.length });
  $('#m2-p').textContent = t('m2_p', { n: flats.length, h: HORIZON });
  $('#formula').innerHTML = t('formula');
  renderControls(); renderLedger();
}
function boot() {
  D = DATA[region];
  flats = D.units.map(u => ({ ...u, rooms: Number(u.rooms) || 0, floor: u.floor === null || u.floor === undefined || u.floor === '' ? null : Number(u.floor) }));
  if (!flats.some(f => f.id === selectedId)) selectedId = flats[0].id;
  const v = k => { const i = input(k); return i ? i.value : null; };
  params = { elasticity: v('elasticity'), cost: v('cost'), carry: v('carry'), commission: v('commission') };
  history.replaceState(null, '', `?region=${region}&lang=${lang}`);
  renderStatic(); render();
}
document.querySelectorAll('.objective').forEach(b => b.addEventListener('click', () => { objective = b.dataset.objective; render(); }));
boot();
</script>
